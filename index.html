<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Léman Courses – Commande</title>

<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#0B2A44,#0F3D5E);
    color:#fff;
    padding:20px;
  }
  .card{
    max-width:560px;
    margin:auto;
    background:#fff;
    color:#000;
    border-radius:16px;
    padding:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.3);
  }
  h1{margin:0 0 6px 0;text-align:center;color:#0B2A44;}
  .sub{margin:0 0 16px 0;text-align:center;color:#555;font-size:13px;}
  label{font-weight:bold;font-size:13px;display:block;margin-top:10px;}
  input,select,textarea,button{
    width:100%;
    padding:12px;
    margin-top:6px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:14px;
    box-sizing:border-box;
  }
  textarea{min-height:70px;resize:vertical;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.row{grid-template-columns:1fr}}
  .price{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#0B2A44;
    margin:16px 0 6px 0;
  }
  .detail{
    text-align:center;
    font-size:13px;
    color:#333;
    margin-bottom:10px;
  }
  .warning{
    text-align:center;
    font-size:13px;
    font-weight:bold;
    color:#b00020;
    margin-top:6px;
  }
  .status{
    font-size:12px;
    color:#444;
    background:#f2f2f2;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
  }
  button{
    background:#0B2A44;
    color:#fff;
    border:none;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
  }
  button.secondary{background:#25D366;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .foot{
    margin-top:10px;
    font-size:11px;
    text-align:center;
    color:#666;
  }
</style>
</head>

<body>
<div class="card">
  <h1>LÉMAN COURSES</h1>
  <div class="sub">Transport express 24h/24 – 7j/7</div>

  <!-- TRAJET (NPA -> KM AUTO) -->
  <div class="row">
    <div>
      <label>NPA départ</label>
      <input id="npaDepart" inputmode="numeric" placeholder="Ex : 1000" />
    </div>
    <div>
      <label>NPA arrivée</label>
      <input id="npaArrivee" inputmode="numeric" placeholder="Ex : 1200" />
    </div>
  </div>

  <label>Kilomètres (calcul automatique)</label>
  <input id="km" type="number" readonly placeholder="Calcul automatique…" />

  <div class="status" id="kmStatus">Entre les deux NPA pour calculer la distance.</div>

  <!-- OPTIONS TARIF -->
  <div class="row">
    <div>
      <label>Poids du colis (kg)</label>
      <input id="poids" type="number" min="1" placeholder="Max 30 kg" />
    </div>
    <div>
      <label>Inter-villes ?</label>
      <select id="interville">
        <option value="non">Non</option>
        <option value="oui">Oui</option>
      </select>
      <div style="font-size:11px;color:#666;margin-top:-8px;">
        (appliqué uniquement si distance &gt; 10 km)
      </div>
    </div>
  </div>

  <div class="row">
    <div>
      <label>Service</label>
      <select id="service">
        <option value="normal">Normal</option>
        <option value="urgent">Urgent</option>
        <option value="express">Express</option>
      </select>
    </div>
    <div>
      <label>Horaire</label>
      <select id="horaire">
        <option value="jour">Jour</option>
        <option value="nuit">Nuit / Dimanche</option>
      </select>
    </div>
  </div>

  <div class="price" id="prix">CHF –.–</div>
  <div class="detail" id="detail"></div>
  <div class="warning" id="warning"></div>

  <!-- FORMULAIRE CLIENT -->
  <hr style="border:none;border-top:1px solid #e6e6e6;margin:18px 0;" />

  <div class="row">
    <div>
      <label>Nom & Prénom</label>
      <input id="clientNom" />
    </div>
    <div>
      <label>Téléphone</label>
      <input id="clientTel" />
    </div>
  </div>

  <div class="row">
    <div>
      <label>Email (optionnel)</label>
      <input id="clientEmail" />
    </div>
    <div>
      <label>Entreprise (optionnel)</label>
      <input id="clientSociete" />
    </div>
  </div>

  <label>Adresse prise en charge (optionnel)</label>
  <input id="pickupAdr" placeholder="Rue, n°, ville…" />

  <label>Adresse livraison (optionnel)</label>
  <input id="livAdr" placeholder="Rue, n°, ville…" />

  <label>Nature du colis</label>
  <input id="nature" placeholder="Ex : documents, petit colis, matériel…" />

  <label>Remarques (optionnel)</label>
  <textarea id="remarques" placeholder="Horaires, étage, code, consignes…"></textarea>

  <button id="btnEmail" onclick="envoyerEmail()" disabled>Envoyer la commande par email</button>
  <button id="btnWA" class="secondary" onclick="envoyerWhatsapp()" disabled>Envoyer par WhatsApp</button>

  <div class="foot">Prix indicatif – confirmation avant prise en charge. Colis &gt; 30 kg : devis spécial.</div>
</div>

<script>
/* =========================
   PARAMÈTRES TARIFAIRES
========================= */

// Base selon km + service (ta logique “grille” interne ; client ne la voit pas)
function baseKm(km, service){
  // Tu peux ajuster ces montants si besoin
  if(km <= 10)  return service==="normal"? 35 : service==="urgent"? 55 : 75;
  if(km <= 30)  return service==="normal"? 55 : service==="urgent"? 85 : 115;
  if(km <= 80)  return service==="normal"? 75 : service==="urgent"? 115: 155;
  if(km <= 150) return service==="normal"? 95 : service==="urgent"? 145: 195;
  if(km <= 300) return service==="normal"? 125: service==="urgent"? 185: 245;
  if(km <= 600) return service==="normal"? 165: service==="urgent"? 245: 325;
  if(km <= 1500)return service==="normal"? 205: service==="urgent"? 305: 405;
  return null; // hors plage => devis
}

// Poids : coef + supplément minimum (pour que 5kg ≠ 20kg même avec arrondi)
function reglePoids(p){
  if(p <= 5)  return {coef:1.00, sup:0};
  if(p <= 10) return {coef:1.10, sup:5};
  if(p <= 20) return {coef:1.25, sup:10};
  if(p <= 30) return {coef:1.40, sup:20};
  return null; // >30 => devis spécial
}

function arrondi5_haut(x){
  return Math.ceil(x / 5) * 5;
}

/* =========================
   DOM
========================= */
const npaDepart = document.getElementById("npaDepart");
const npaArrivee = document.getElementById("npaArrivee");
const kmInput = document.getElementById("km");
const kmStatus = document.getElementById("kmStatus");

const poidsInput = document.getElementById("poids");
const intervilleInput = document.getElementById("interville");
const serviceInput = document.getElementById("service");
const horaireInput = document.getElementById("horaire");

const prixEl = document.getElementById("prix");
const detailEl = document.getElementById("detail");
const warningEl = document.getElementById("warning");

const btnEmail = document.getElementById("btnEmail");
const btnWA = document.getElementById("btnWA");

/* =========================
   CALCUL KM (Nominatim + OSRM)
========================= */
let currentKm = null;
let debounceTimer = null;

function cleanNPA(v){
  return (v || "").toString().trim().replace(/\s+/g,"");
}

async function geocodeNPA(npa){
  // Nominatim (OpenStreetMap). On limite à la Suisse.
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ch&q=${encodeURIComponent(npa + " Switzerland")}`;
  const r = await fetch(url, { headers: { "Accept": "application/json" }});
  const d = await r.json();
  if(!d || !d[0]) return null;
  return { lon: d[0].lon, lat: d[0].lat };
}

async function routeKm(a, b){
  const url = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;
  const r = await fetch(url, { headers: { "Accept": "application/json" }});
  const d = await r.json();
  if(!d || !d.routes || !d.routes[0]) return null;
  return d.routes[0].distance / 1000;
}

async function computeKm(){
  const dep = cleanNPA(npaDepart.value);
  const arr = cleanNPA(npaArrivee.value);

  currentKm = null;
  kmInput.value = "";
  btnEmail.disabled = true;
  btnWA.disabled = true;
  prixEl.textContent = "CHF –.–";
  detailEl.textContent = "";
  warningEl.textContent = "";

  if(!dep || !arr){
    kmStatus.textContent = "Entre les deux NPA pour calculer la distance.";
    return;
  }

  kmStatus.textContent = "Calcul distance…";
  try{
    const A = await geocodeNPA(dep);
    const B = await geocodeNPA(arr);
    if(!A || !B){
      kmStatus.textContent = "NPA introuvable. Vérifie les codes postaux.";
      warningEl.textContent = "Impossible de calculer la distance.";
      return;
    }

    const km = await routeKm(A, B);
    if(km === null){
      kmStatus.textContent = "Erreur routeur. Réessaie dans quelques secondes.";
      warningEl.textContent = "Impossible de calculer la distance.";
      return;
    }

    currentKm = Math.round(km * 10) / 10; // 1 décimale
    kmInput.value = currentKm;
    kmStatus.textContent = `Distance calculée : ${currentKm} km`;
    updatePrix();
  }catch(e){
    kmStatus.textContent = "Erreur réseau. Réessaie.";
    warningEl.textContent = "Impossible de calculer la distance.";
  }
}

function debouncedComputeKm(){
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(computeKm, 700);
}

/* =========================
   CALCUL PRIX
========================= */
function updatePrix(){
  warningEl.textContent = "";

  const km = Number(kmInput.value);
  const poids = Number(poidsInput.value);
  const service = serviceInput.value;
  const horaire = horaireInput.value;
  const interville = intervilleInput.value;

  if(!km || !poids){
    prixEl.textContent = "CHF –.–";
    detailEl.textContent = "";
    btnEmail.disabled = true;
    btnWA.disabled = true;
    return;
  }

  const rp = reglePoids(poids);
  if(!rp){
    prixEl.textContent = "DEVIS";
    detailEl.textContent = "";
    warningEl.textContent = "⚠️ Colis > 30 kg – devis spécial requis";
    btnEmail.disabled = true;
    btnWA.disabled = true;
    return;
  }

  let base = baseKm(km, service);
  if(base === null){
    prixEl.textContent = "DEVIS";
    detailEl.textContent = "";
    warningEl.textContent = "Distance hors grille – devis requis";
    btnEmail.disabled = true;
    btnWA.disabled = true;
    return;
  }

  let prix = base;

  // Nuit / dimanche
  if(horaire === "nuit") prix *= 1.25;

  // Intervilles : seulement si >10 km
  if(interville === "oui" && km > 10) prix += (km * 1.20);

  // Poids
  prix = prix * rp.coef + rp.sup;

  // Arrondi pro
  prix = arrondi5_haut(prix);

  prixEl.textContent = `CHF ${prix}.–`;
  detailEl.textContent = `${km} km · ${poids} kg · ${service.toUpperCase()} · ${horaire === "nuit" ? "NUIT/DIM" : "JOUR"}`;

  // Active l’envoi si minimum client rempli
  const okClient = (document.getElementById("clientNom").value.trim() !== "" &&
                    document.getElementById("clientTel").value.trim() !== "");
  btnEmail.disabled = !okClient;
  btnWA.disabled = !okClient;
}

/* =========================
   MESSAGE COMMANDE + ENVOI
========================= */
function buildMessage(){
  const clientNom = document.getElementById("clientNom").value.trim();
  const clientTel = document.getElementById("clientTel").value.trim();
  const clientEmail = document.getElementById("clientEmail").value.trim();
  const clientSociete = document.getElementById("clientSociete").value.trim();

  const pickupAdr = document.getElementById("pickupAdr").value.trim();
  const livAdr = document.getElementById("livAdr").value.trim();
  const nature = document.getElementById("nature").value.trim();
  const remarques = document.getElementById("remarques").value.trim();

  const dep = cleanNPA(npaDepart.value);
  const arr = cleanNPA(npaArrivee.value);

  const km = kmInput.value;
  const poids = poidsInput.value;
  const service = serviceInput.value.toUpperCase();
  const horaire = (horaireInput.value === "nuit") ? "NUIT / DIMANCHE" : "JOUR";
  const interville = intervilleInput.value.toUpperCase();

  return `COMMANDE – LÉMAN COURSES

CLIENT
Nom: ${clientNom}
Téléphone: ${clientTel}
Email: ${clientEmail || "-"}
Entreprise: ${clientSociete || "-"}

TRAJET
NPA départ: ${dep}
NPA arrivée: ${arr}
Distance: ${km} km

COLIS
Poids: ${poids} kg
Nature: ${nature || "-"}

ADRESSES (optionnel)
Prise en charge: ${pickupAdr || "-"}
Livraison: ${livAdr || "-"}

SERVICE
Type: ${service}
Horaire: ${horaire}
Inter-villes: ${interville}

TARIF (indicatif)
${prixEl.textContent}

REMARQUES
${remarques || "-"}

Prix indicatif – confirmation avant prise en charge.`;
}

function envoyerEmail(){
  const clientNom = document.getElementById("clientNom").value.trim();
  const clientTel = document.getElementById("clientTel").value.trim();
  if(!clientNom || !clientTel){
    alert("Merci de renseigner au minimum Nom/Prénom et Téléphone.");
    return;
  }
  const sujet = "Commande – Léman Courses";
  const corps = buildMessage();
  const link = "mailto:info@leman-courses.ch"
    + "?subject=" + encodeURIComponent(sujet)
    + "&body=" + encodeURIComponent(corps);
  window.location.href = link;
}

function envoyerWhatsapp(){
  const clientNom = document.getElementById("clientNom").value.trim();
  const clientTel = document.getElementById("clientTel").value.trim();
  if(!clientNom || !clientTel){
    alert("Merci de renseigner au minimum Nom/Prénom et Téléphone.");
    return;
  }
  const text = buildMessage();
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}

/* =========================
   ÉVÉNEMENTS
========================= */
npaDepart.addEventListener("input", debouncedComputeKm);
npaArrivee.addEventListener("input", debouncedComputeKm);

[poidsInput, intervilleInput, serviceInput, horaireInput].forEach(el=>{
  el.addEventListener("input", updatePrix);
});

document.getElementById("clientNom").addEventListener("input", updatePrix);
document.getElementById("clientTel").addEventListener("input", updatePrix);
</script>

</body>
</html>
