<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>LÉMAN COURSES – Calculateur</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #0b2a44, #0f3d6b);
  color: #fff;
}

.card {
  max-width: 420px;
  margin: 40px auto;
  background: #fff;
  color: #000;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
}

h1 { text-align: center; margin-bottom: 5px; }
p.sub { text-align: center; font-size: 13px; color: #555; }

label { font-size: 13px; margin-top: 12px; display: block; }

input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 15px;
}

button {
  background: #0b2a44;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  border: none;
}

.price {
  margin: 20px 0;
  font-size: 26px;
  font-weight: bold;
  text-align: center;
  color: #0b2a44;
}

.detail {
  font-size: 12px;
  text-align: center;
  color: #444;
}

.hidden { display: none; }
</style>
</head>

<body>

<div class="card">
  <h1>LÉMAN COURSES</h1>
  <p class="sub">Transport express 24h/24 – 7j/7</p>

  <label>Type de course</label>
  <select id="service">
    <option value="normal">Normale</option>
    <option value="urgent">Urgente</option>
    <option value="express">Express</option>
  </select>

  <label>Inter-villes</label>
  <select id="interville">
    <option value="no">Non</option>
    <option value="yes">Oui</option>
  </select>

  <label>Distance (km)</label>
  <input type="number" id="km" min="1" placeholder="Ex : 45">

  <label>Poids du colis (kg)</label>
  <input type="number" id="poids" min="1" placeholder="Max 30 kg">

  <label>Horaire</label>
  <select id="horaire">
    <option value="jour">Jour</option>
    <option value="nuit">Nuit / Dimanche</option>
  </select>

  <div class="price" id="resultat">CHF —</div>
  <div class="detail" id="detail"></div>

  <button id="commander">Envoyer la commande</button>
</div>

<script>
// 🔒 GRILLE TARIFAIRE (INVISIBLE CLIENT)
const grille = [
  { min:0, max:10, normal:6.5, urgent:43, express:30 },
  { min:11, max:30, normal:10, urgent:73, express:48 },
  { min:31, max:80, normal:13.5, urgent:103, express:66 },
  { min:81, max:150, normal:17, urgent:133, express:84 },
  { min:151, max:250, normal:20.5, urgent:163, express:102 }
];

// ⚖️ COEFFICIENT POIDS
function coefPoids(p) {
  if (p <= 5) return 1;
  if (p <= 10) return 1.15;
  if (p <= 20) return 1.35;
  if (p <= 30) return 1.6;
  return null;
}

// 🔍 PRIX KM
function prixKm(km, type) {
  for (let g of grille) {
    if (km >= g.min && km <= g.max) return g[type];
  }
  return null;
}

// 💰 CALCUL CENTRAL
function updatePrice() {
  const km = Number(document.getElementById("km").value);
  const poids = Number(document.getElementById("poids").value);
  const service = document.getElementById("service").value;
  const interville = document.getElementById("interville").value;
  const horaire = document.getElementById("horaire").value;

  if (!km || !poids) return;

  if (poids > 30) {
    alert("Colis > 30 kg : devis spécial requis");
    return;
  }

  let base = prixKm(km, service);
  if (base === null) {
    document.getElementById("resultat").textContent = "Devis requis";
    return;
  }

  let prix = base;
  if (interville === "yes") prix += km * 1.2;
  if (horaire === "nuit") prix *= 1.25;

  prix *= coefPoids(poids);
  prix = Math.round(prix / 5) * 5;

  document.getElementById("resultat").textContent = `CHF ${prix}.–`;
  document.getElementById("detail").textContent =
    `${km} km · ${poids} kg · ${service.toUpperCase()}`;
}

// 🔁 ÉCOUTEURS
["km","poids","service","interville","horaire"].forEach(id =>
  document.getElementById(id).addEventListener("input", updatePrice)
);
</script>

</body>
</html>
