<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Devis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- jsPDF CDN (OBLIGATOIRE) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
        integrity="sha512-AqCANc+XG4V0X5zKcF+RZrFz5nH2N0l7l8xY+K2p5K4xkC5x8C5h2Kxv9Zb7yZJr0z8nX1K3Kz0FQK7x5w=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>

<style>
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0B2A44;
  color:#fff;
  padding:20px;
}
.card{
  max-width:520px;
  margin:auto;
  background:#fff;
  color:#000;
  padding:20px;
  border-radius:12px;
}
h1{text-align:center;color:#0B2A44;}
label{font-size:13px;font-weight:bold;}
input,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  background:#0B2A44;
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
<h1>DEVIS – LÉMAN COURSES</h1>

<label>Nom du client</label>
<input id="clientNom" placeholder="Nom Prénom">

<label>Téléphone</label>
<input id="clientTel" placeholder="079 xxx xx xx">

<label>Distance (km)</label>
<input id="km" placeholder="Ex : 45">

<label>Poids du colis (kg)</label>
<input id="poids" placeholder="Ex : 12">

<label>Prix estimé</label>
<input id="prix" value="CHF 120.–">

<button onclick="genererPDF()">📄 Télécharger le devis PDF</button>
</div>

<script>
function genererPDF(){

  // Vérification basique
  if(!clientNom.value || !clientTel.value){
    alert("Merci de renseigner le nom et le téléphone.");
    return;
  }

  // jsPDF
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 15;

  // Titre
  doc.setFontSize(16);
  doc.text("DEVIS – LÉMAN COURSES", 105, y, { align: "center" });
  y += 10;

  doc.setFontSize(10);
  doc.text("Transport express 24h/24 – 7j/7", 105, y, { align: "center" });
  y += 10;

  doc.line(10, y, 200, y);
  y += 10;

  // Client
  doc.setFontSize(12);
  doc.text("CLIENT", 10, y);
  y += 6;

  doc.setFontSize(10);
  doc.text("Nom : " + clientNom.value, 10, y); y += 5;
  doc.text("Téléphone : " + clientTel.value, 10, y); y += 10;

  // Course
  doc.setFontSize(12);
  doc.text("COURSE", 10, y);
  y += 6;

  doc.setFontSize(10);
  doc.text("Distance : " + km.value + " km", 10, y); y += 5;
  doc.text("Poids colis : " + poids.value + " kg", 10, y); y += 10;

  // Prix
  doc.setFontSize(14);
  doc.text("PRIX ESTIMÉ : " + prix.value, 10, y);
  y += 12;

  // Footer
  doc.setFontSize(9);
  doc.text(
    "Prix indicatif – confirmation avant prise en charge.\n" +
    "Léman Courses – Suisse romande",
    10,
    y
  );

  // 🔽 TÉLÉCHARGEMENT
  doc.save("Devis_Leman_Courses.pdf");
}
</script>

</body>
</html>
