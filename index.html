

<button id="pdfBtn" style="
  
  width:100%;
  margin-top:12px;
  padding:14px;
  border-radius:10px;
  border:none;
  background:#0B2A44;
  color:#fff;
  font-size:16px;
  cursor:pointer;
">
  Générer le devis PDF
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  
  const { jsPDF } = window.jspdf;

  function arrondir5(valeur) {
    return Math.round(valeur / 5) * 5;
  }

  function calculer() {
    const base = parseFloat(document.getElementById("type").value);
    const km = parseFloat(document.getElementById("km").value) || 0;
    const urgence = parseFloat(document.getElementById("urgence").value);
    const horaire = parseFloat(document.getElementById("horaire").value);

    let supplementKm = km > 10 ? (km - 10) * 2.5 : 0;

    let prix = (base + supplementKm) * (1 + urgence / 100) * horaire;
    prix = arrondir5(prix);

    document.getElementById("resultat").innerText = "CHF " + prix + ".–";

    document.getElementById("details").innerText =
      `Base : ${base} CHF
Distance : ${km} km
Supplément km : ${supplementKm.toFixed(2)} CHF
Urgence : +${urgence} %
Horaire : × ${horaire}
→ Total arrondi : ${prix} CHF`;

    return { base, km, supplementKm, urgence, horaire, prix };
  }

  function genererPDF() {
    const data = calculer();
    const doc = new jsPDF();

    const date = new Date().toLocaleDateString("fr-CH");

    doc.setFontSize(16);
    doc.text("DEVIS – LÉMAN COURSES", 20, 20);

    doc.setFontSize(11);
    doc.text(`Date : ${date}`, 20, 30);

    doc.line(20, 34, 190, 34);

    doc.text(`Type de course : ${data.base === 35 ? "Locale" : "Inter-villes"}`, 20, 45);
    doc.text(`Distance : ${data.km} km`, 20, 55);
    doc.text(`Supplément km : ${data.supplementKm.toFixed(2)} CHF`, 20, 65);
    doc.text(`Urgence : +${data.urgence} %`, 20, 75);
    doc.text(`Horaire : x ${data.horaire}`, 20, 85);

    doc.line(20, 95, 190, 95);

    doc.setFontSize(14);
    doc.text(`TOTAL ESTIMÉ : CHF ${data.prix}.–`, 20, 110);

    doc.setFontSize(10);
    doc.text(
      "Prix indicatif. Le devis définitif est confirmé avant la course.\nLéman Courses – Transport express 24h/24 – 7j/7",
      20,
      130
    );

    doc.save(`Devis_Leman_Courses_${date.replace(/\./g, "_")}.pdf`);
  }

  ["type", "km", "urgence", "horaire"].forEach(id =>
    document.getElementById(id).addEventListener("input", calculer)
  );

  document.getElementById("pdfBtn").addEventListener("click", genererPDF);

  calculer();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
  }
</script>
