<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Devis transport</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{font-family:Arial;background:#0B2A44;padding:20px;margin:0}
.card{max-width:820px;margin:auto;background:#fff;padding:20px;border-radius:14px}
h1{text-align:center;color:#0B2A44;margin:0}
.sub{text-align:center;font-size:13px;color:#666;margin-bottom:10px}
label{font-weight:bold;font-size:13px}
input,select,textarea,button{
  width:100%;padding:12px;margin-top:6px;margin-bottom:12px;
  border-radius:8px;border:1px solid #ccc
}
button{background:#0B2A44;color:#fff;font-weight:bold;border:none;cursor:pointer}
.price{font-size:28px;text-align:center;color:#0B2A44}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small{text-align:center;font-size:11px;color:#666}
.warning{text-align:center;color:red;font-weight:bold}
.note{text-align:center;font-size:12px;color:#444;margin-top:8px}
@media(max-width:600px){.row{grid-template-columns:1fr}}

#mapPopup{display:none;position:fixed;inset:0;background:#000000cc;z-index:9999}
#mapHeader{background:#fff;padding:14px;font-weight:bold;cursor:pointer}
#map{width:100%;height:100%}
.mapInfo{
  position:absolute;top:60px;left:50%;transform:translateX(-50%);
  background:#fff;padding:10px 16px;border-radius:10px;font-weight:bold
}
</style>
</head>

<body>
<div class="card">

<h1>LÉMAN COURSES</h1>
<div class="sub">Transport express – Suisse romande</div>

<div class="small" id="topInfo">Distance : – km • Temps estimé : –</div>
<div class="small">Temps donné à titre indicatif selon les conditions de circulation</div>

<!-- NPA -->
<div class="row">
  <div><label>NPA départ</label><input id="npaDepart"></div>
  <div><label>NPA arrivée</label><input id="npaArrivee"></div>
</div>

<!-- VILLES AUTO -->
<div class="row">
  <div><label>Ville départ</label><input id="villeDepart" readonly></div>
  <div><label>Ville arrivée</label><input id="villeArrivee" readonly></div>
</div>

<label>Résultat calcul</label>
<input id="km" readonly>

<div class="row">
  <div><label>Poids (kg)</label><input id="poids" type="number" value="5"></div>
  <div>
    <label>Service</label>
    <select id="service">
      <option>Normal</option>
      <option>Urgent</option>
      <option>Express</option>
    </select>
  </div>
</div>

<label>Code client (facultatif)</label>
<input id="codeClient" placeholder="Ex : LC-PRO-15">

<div class="price" id="prix">CHF –.–</div>
<div class="note">Tarif indicatif – ajustable selon contraintes réelles</div>
<div class="small" id="prixDetail"></div>
<div class="warning" id="warning"></div>

<button id="btnMap" style="display:none" onclick="openMap()">🗺️ Voir le trajet</button>

<hr>

<h3>Client</h3>
<div class="row">
  <div><label>Nom</label><input id="clientNom"></div>
  <div><label>Téléphone</label><input id="clientTel"></div>
</div>
<label>Adresse départ</label><input id="adrDepart">
<label>Adresse arrivée</label><input id="adrArrivee">
<label>Nature du colis</label><input id="nature">
<label>Remarques</label><textarea id="remarques"></textarea>

<button onclick="envoyerWhatsApp()">💬 Envoyer la commande via WhatsApp</button>

<p class="small">TVA 8.1 % incluse • Minimum de course 25 CHF</p>
</div>

<!-- POPUP CARTE -->
<div id="mapPopup">
  <div id="mapHeader" onclick="closeMap()">← Retour au calculateur</div>
  <div id="map"></div>
  <div class="mapInfo" id="mapInfo"></div>
</div>

<script>
let coordA, coordB, routeGeo, map, routeLayer;
let dureeMin = 0, isInterville=false;

/* ===== TARIFS ===== */
function baseKm(km){
  if(km <= 10)  return 20;
  if(km <= 30)  return 32;
  if(km <= 80)  return 50;
  if(km <= 150) return 68;
  if(km <= 300) return 85;
  return 100;
}
function coefService(s){
  if(s === "Urgent")  return 1.2;
  if(s === "Express") return 1.4;
  return 1;
}
function coefPoids(p){
  if(p <= 5)  return 1;
  if(p <= 10) return 1.05;
  if(p <= 20) return 1.12;
  if(p <= 30) return 1.2;
  return null;
}
function remiseClient(code){
  if(!code) return 0;
  code = code.toUpperCase().trim();
  if(code === "LC-PRO-10") return 0.10;
  if(code === "LC-PRO-15") return 0.15;
  if(code === "LC-VIP")    return 0.20;
  return 0;
}

/* ===== VILLE DEPUIS NPA ===== */
async function villeDepuisNPA(npa){
  const r = await fetch(
    `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ch&addressdetails=1&q=${npa}`
  );
  const d = await r.json();
  if(!d[0] || !d[0].address) return "";
  return d[0].address.city ||
         d[0].address.town ||
         d[0].address.village ||
         d[0].address.municipality ||
         "";
}

/* ===== DISTANCE & DURÉE ===== */
async function calculKm(){
  if(!npaDepart.value || !npaArrivee.value) return;

  const geo = async npa =>{
    const r = await fetch(
      `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ch&q=${npa}`
    );
    const d = await r.json();
    return d[0] ? [d[0].lon, d[0].lat] : null;
  };

  coordA = await geo(npaDepart.value);
  coordB = await geo(npaArrivee.value);
  if(!coordA || !coordB) return;

  villeDepart.value = await villeDepuisNPA(npaDepart.value);
  villeArrivee.value = await villeDepuisNPA(npaArrivee.value);

  const r = await fetch(
    `https://router.project-osrm.org/route/v1/driving/${coordA[0]},${coordA[1]};${coordB[0]},${coordB[1]}?overview=full&geometries=geojson`
  );
  const d = await r.json();

  const kmCalc = Math.round(d.routes[0].distance/1000);
  dureeMin = Math.round(d.routes[0].duration/60);
  routeGeo = d.routes[0].geometry;
  isInterville = kmCalc > 10;

  km.value = `${kmCalc} km – ${Math.floor(dureeMin/60)}h${dureeMin%60}`;
  topInfo.textContent =
    `Distance : ${kmCalc} km • Temps estimé : ${Math.floor(dureeMin/60)}h${dureeMin%60}`;

  btnMap.style.display = "block";
  calculPrix(kmCalc);
}

/* ===== PRIX ===== */
function calculPrix(k){
  const p = Number(poids.value);
  const cP = coefPoids(p);
  if(!cP){
    prix.textContent = "DEVIS";
    warning.textContent = "Colis > 30 kg";
    return;
  }

  let t = baseKm(k);
  t *= coefService(service.value);
  t *= cP;
  if(isInterville) t += k * 0.5;
  t *= 0.9;

  let infoRemise = "";
  const r = remiseClient(codeClient.value);
  if(r > 0){
    t *= (1 - r);
    infoRemise = ` • remise ${Math.round(r*100)}% (à valider)`;
  }

  if(t < 25) t = 25;
  t = Math.ceil(t / 5) * 5;

  prix.textContent = `CHF ${t}.–`;
  prixDetail.textContent =
    `${service.value} • ${isInterville ? "Inter-villes" : "Locale"}${infoRemise}`;
  warning.textContent = "";
}

/* ===== CARTE ===== */
function openMap(){
  mapPopup.style.display="block";
  setTimeout(()=>{
    if(!map){
      map = L.map("map");
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
    }
    if(routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.geoJSON(routeGeo,{style:{color:"red",weight:4}}).addTo(map);
    map.fitBounds(routeLayer.getBounds(),{padding:[40,40]});
    L.marker([coordA[1],coordA[0]]).addTo(map).bindPopup("Départ");
    L.marker([coordB[1],coordB[0]]).addTo(map).bindPopup("Arrivée");
    mapInfo.textContent =
      `${Math.floor(dureeMin/60)}h${dureeMin%60} • ${isInterville?"Inter-villes":"Locale"}`;
  },200);
}
function closeMap(){mapPopup.style.display="none";}

/* ===== WHATSAPP ===== */
function envoyerWhatsApp(){
  const msg =
`🚚 LÉMAN COURSES

Client : ${clientNom.value}
Téléphone : ${clientTel.value}

Code client : ${codeClient.value || "—"} (à valider)

Départ : ${npaDepart.value} ${villeDepart.value}
Arrivée : ${npaArrivee.value} ${villeArrivee.value}

Distance : ${km.value}
Service : ${service.value}
Poids : ${poids.value} kg
Type : ${isInterville?"Inter-villes":"Locale"}

Prix indicatif : ${prix.textContent}

Colis : ${nature.value}
Remarques : ${remarques.value}`;

  window.open(
    "https://wa.me/41796467442?text="+encodeURIComponent(msg),
    "_blank"
  );
}

/* ===== EVENTS ===== */
[npaDepart,npaArrivee].forEach(e=>e.addEventListener("input",calculKm));
[poids,service,codeClient].forEach(e=>
  e.addEventListener("input",()=>calculPrix(parseInt(km.value)))
);
</script>

</body>
</html>
