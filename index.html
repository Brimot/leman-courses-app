<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Commande transport express</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#0b2a44,#0f3d66);
  padding:20px;
  color:#fff;
}
.wrap{max-width:1000px;margin:auto}
h1{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

.card{
  background:#fff;
  color:#000;
  border-radius:16px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.25)
}

label{font-size:12px;color:#555}
input,select,textarea,button{
  width:100%;
  margin-top:6px;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:14px;
  box-sizing:border-box
}
textarea{min-height:80px}

button{
  background:#0b2a44;
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}

.price{
  font-size:28px;
  font-weight:bold;
  color:#0b2a44;
  margin-top:10px
}

.note{font-size:12px;color:#666;margin-top:6px}
.status{font-size:12px;margin-top:8px}

.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.popupContent{
  background:#fff;
  color:#000;
  padding:24px;
  border-radius:16px;
  max-width:420px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
}
.popupContent h3{margin-top:0;color:#b42318}
.popupContent button{
  margin-top:14px;
  background:#b42318;
}
</style>
</head>

<body>
<div class="wrap">
<h1>LÉMAN COURSES</h1>

<div class="grid">

<!-- COMMANDE -->
<div class="card">
<h2>Commande</h2>

<label>Nom du client</label>
<input id="clientNom">

<label>Téléphone</label>
<input id="clientTel">

<hr>

<h3>Colis</h3>

<label>Nature du colis</label>
<select id="colisNature">
  <option value="">— Sélectionner —</option>
  <option>Documents</option>
  <option>Colis standard</option>
  <option>Fragile</option>
  <option>Médical / sensible</option>
  <option>Autre</option>
</select>

<label>Poids du colis (kg)</label>
<input id="colisPoids" type="number" step="0.1" min="0">

<hr>

<h3>Prise en charge</h3>
<label>Entreprise</label>
<input id="pickupEntreprise">
<label>Adresse</label>
<input id="pickupAdresse">
<label>NPA</label>
<input id="pickupNPA">
<label>Ville</label>
<input id="pickupVille">

<hr>

<h3>Livraison</h3>
<label>Entreprise</label>
<input id="dropEntreprise">
<label>Adresse</label>
<input id="dropAdresse">
<label>NPA</label>
<input id="dropNPA">
<label>Ville</label>
<input id="dropVille">

<label>Remarques</label>
<textarea id="remarques"></textarea>
</div>

<!-- TARIF -->
<div class="card">
<h2>Tarif & distance</h2>

<label>Urgence</label>
<select id="urgence">
  <option value="0">Standard</option>
  <option value="10">Urgent +10%</option>
  <option value="25">Express +25%</option>
</select>

<label>Horaire</label>
<select id="horaire">
  <option value="1">Jour</option>
  <option value="1.25">Nuit</option>
  <option value="1.3">Dimanche / férié</option>
</select>

<label>Kilomètres (auto)</label>
<input id="km" disabled>

<div class="status" id="kmStatus">En attente des adresses…</div>

<div class="price" id="resultat">CHF 0.–</div>
<div class="note" id="detail"></div>

<button id="sendBtn" disabled>📧 Envoyer la commande</button>
</div>

</div>
</div>

<!-- POPUP POIDS -->
<div class="popup" id="weightPopup">
  <div class="popupContent">
    <h3>⚠️ Colis hors standard</h3>
    <p>
      Les colis de <strong>plus de 30 kg</strong> nécessitent une
      <strong>demande spéciale / devis sur mesure</strong>.
    </p>
    <p>
      Merci de nous contacter directement pour une solution adaptée.
    </p>
    <button onclick="closePopup()">Fermer</button>
  </div>
</div>

<script>
const DISPATCH_EMAIL = "TONEMAIL@lemancourses.ch"; // ⬅️ À modifier
let currentKm = 0;

function round5(v){ return Math.round(v/5)*5 }

// 🔹 PRIX
function updatePrice(){
  let base = 35;
  let kmPrice = 0;

  if(currentKm > 10){
    base = 65;
    kmPrice = currentKm * 1.2;
    detail.textContent = `Inter-villes · ${currentKm} km × 1.20 CHF`;
  }else{
    detail.textContent = `Course locale (≤ 10 km)`;
  }

  let prix = (base + kmPrice) * (1 + urgence.value/100) * horaire.value;
  prix = round5(prix);

  resultat.textContent = `CHF ${prix}.–`;
  checkWeight();
}

// 🔹 KM
async function computeKm(){
  if(!pickupVille.value || !dropVille.value) return;

  kmStatus.textContent="Calcul de la distance…";

  const geo = async q => {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ch&q=${encodeURIComponent(q)}`);
    const d = await r.json();
    return d[0] ? {lat:d[0].lat,lon:d[0].lon} : null;
  };

  const q1 = `${pickupAdresse.value}, ${pickupNPA.value} ${pickupVille.value}, Suisse`;
  const q2 = `${dropAdresse.value}, ${dropNPA.value} ${dropVille.value}, Suisse`;

  const A = await geo(q1);
  const B = await geo(q2);
  if(!A || !B){ kmStatus.textContent="Adresse invalide"; return; }

  const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${A.lon},${A.lat};${B.lon},${B.lat}?overview=false`);
  const d = await r.json();

  currentKm = Math.round((d.routes[0].distance/1000)*10)/10;
  km.value = currentKm;
  kmStatus.textContent = `Distance calculée : ${currentKm} km`;

  updatePrice();
}

// 🔹 POIDS
function checkWeight(){
  const poids = parseFloat(colisPoids.value || 0);

  if(poids > 30){
    sendBtn.disabled = true;
    weightPopup.style.display = "flex";
  }else{
    sendBtn.disabled = false;
  }
}

function closePopup(){
  weightPopup.style.display = "none";
}

// 🔹 LISTENERS
["pickupAdresse","pickupNPA","pickupVille","dropAdresse","dropNPA","dropVille"]
.forEach(id=>document.getElementById(id).addEventListener("input",()=>setTimeout(computeKm,800)));

["urgence","horaire"].forEach(id=>document.getElementById(id).addEventListener("change", updatePrice));

colisPoids.addEventListener("input", checkWeight);

// 🔹 ENVOI
sendBtn.onclick=()=>{
  const body=`
COMMANDE LÉMAN COURSES

Client : ${clientNom.value}
Téléphone : ${clientTel.value}

COLIS
Nature : ${colisNature.value}
Poids : ${colisPoids.value} kg

PRISE EN CHARGE
${pickupEntreprise.value}
${pickupAdresse.value}
${pickupNPA.value} ${pickupVille.value}

LIVRAISON
${dropEntreprise.value}
${dropAdresse.value}
${dropNPA.value} ${dropVille.value}

Distance : ${currentKm} km
Prix estimé : ${resultat.textContent}

Remarques :
${remarques.value}
`;
  location.href=`mailto:${DISPATCH_EMAIL}?subject=Commande Léman Courses&body=${encodeURIComponent(body)}`;
};
</script>
  <script>
const colisPoids = document.getElementById("colisPoids");
const urgence = document.getElementById("urgence");
const resultat = document.getElementById("resultat");
const detail = document.getElementById("detail");
const sendBtn = document.getElementById("sendBtn");

function updatePrice() {
  const poids = parseFloat(colisPoids.value || 0);

  let prixBase = 45;
  let coefPoids = poids <= 5 ? 1 :
                  poids <= 10 ? 1.1 :
                  poids <= 20 ? 1.25 :
                  poids <= 30 ? 1.4 : null;

  if (coefPoids === null) {
    alert("Colis > 30 kg → devis spécial");
    return;
  }

  let prix = prixBase * coefPoids;
  prix = Math.round(prix / 5) * 5;

  resultat.textContent = `CHF ${prix}.–`;
  detail.textContent = `Poids : ${poids} kg`;
}

// 🔥 ÉCOUTEURS OBLIGATOIRES
colisPoids.addEventListener("input", updatePrice);
urgence.addEventListener("change", updatePrice);
</script>

</body>
</html>
