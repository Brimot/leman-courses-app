<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Léman Courses – Calculateur express</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B2A44">
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0B2A44, #0F3D6B);
      color: #fff;
    }

    .card {
      max-width: 420px;
      margin: auto;
      background: #fff;
      color: #000;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
      color: #0B2A44;
    }

    p.subtitle {
      text-align: center;
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    select {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .price {
      margin-top: 20px;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      color: #0B2A44;
    }

    .details {
      margin-top: 10px;
      font-size: 13px;
      background: #f2f2f2;
      padding: 10px;
      border-radius: 8px;
      color: #333;
    }

    .footer {
      margin-top: 15px;
      font-size: 11px;
      text-align: center;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>LÉMAN COURSES</h1>
    <p class="subtitle">Transport express – 24h/24 – 7j/7</p>

    <select id="type">
      <option value="35">Course locale – 35 CHF</option>
      <option value="65">Course inter-villes – 65 CHF</option>
    </select>

    <select id="urgence">
      <option value="0">Standard</option>
      <option value="25">Express (+25 %)</option>
    </select>

    <select id="horaire">
      <option value="1">Jour (06h–22h)</option>
      <option value="1.25">Nuit (+25 %)</option>
      <option value="1.3">Dimanche / Férié (+30 %)</option>
    </select>

    <div class="price" id="resultat">CHF 35.–</div>

    <div class="details" id="details"></div>

    <div class="footer">
      Prix indicatif – devis confirmé avant course
    </div>
  </div>

  <script>
    function arrondir5(valeur) {
      return Math.round(valeur / 5) * 5;
    }

    function calculer() {
      const base = parseFloat(document.getElementById("type").value);
      const urgence = parseFloat(document.getElementById("urgence").value);
      const horaire = parseFloat(document.getElementById("horaire").value);

      let prix = base * (1 + urgence / 100) * horaire;
      prix = arrondir5(prix);

      document.getElementById("resultat").innerText = "CHF " + prix + ".–";

      document.getElementById("details").innerText =
        `Base: ${base} CHF\n` +
        `Urgence: +${urgence}%\n` +
        `Horaire: × ${horaire}\n` +
        `→ Total arrondi: ${prix} CHF`;
    }

    document.getElementById("type").addEventListener("change", calculer);
    document.getElementById("urgence").addEventListener("change", calculer);
    document.getElementById("horaire").addEventListener("change", calculer);

    calculer();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>

</body>
</html>
