<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Léman Courses – Commande transport</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#0B2A44,#0F3D5E);
  padding:20px;
  color:#fff;
}
.card{
  max-width:650px;
  margin:auto;
  background:#fff;
  color:#000;
  border-radius:16px;
  padding:20px;
}
h1{text-align:center;color:#0B2A44;margin:0;}
.sub{text-align:center;color:#555;font-size:13px;margin-bottom:15px;}
label{font-weight:bold;font-size:13px;}
input,select,textarea,button{
  width:100%;
  margin-top:6px;
  margin-bottom:12px;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
}
textarea{min-height:70px;}
button{
  background:#0B2A44;
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
button.secondary{background:#25D366;}
.price{font-size:30px;text-align:center;color:#0B2A44;margin:10px 0;}
.detail{text-align:center;font-size:13px;color:#333;}
.warning{text-align:center;color:red;font-weight:bold;}
.small{text-align:center;font-size:11px;color:#666;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="card">

<h1>LÉMAN COURSES</h1>
<div class="sub">Transport express 24h/24 – 7j/7</div>

<!-- TRAJET -->
<div class="row">
  <div>
    <label>NPA départ</label>
    <input id="npaDepart">
  </div>
  <div>
    <label>NPA arrivée</label>
    <input id="npaArrivee">
  </div>
</div>

<label>Kilomètres (auto)</label>
<input id="km" readonly>
<div class="small" id="kmStatus">Saisis les deux NPA</div>

<!-- OPTIONS -->
<div class="row">
  <div>
    <label>Poids du colis (kg)</label>
    <input id="poids" type="number" min="1">
  </div>
  <div>
    <label>Inter-villes</label>
    <select id="interville">
      <option value="Non">Non</option>
      <option value="Oui">Oui</option>
    </select>
  </div>
</div>

<div class="row">
  <div>
    <label>Service</label>
    <select id="service">
      <option value="Normal">Normal</option>
      <option value="Urgent">Urgent</option>
      <option value="Express">Express</option>
    </select>
  </div>
  <div>
    <label>Horaire</label>
    <select id="horaire">
      <option value="Jour">Jour</option>
      <option value="Nuit">Nuit / Dimanche</option>
    </select>
  </div>
</div>

<div class="price" id="prix">CHF –.–</div>
<div class="detail" id="detail"></div>
<div class="warning" id="warning"></div>

<hr>

<!-- CLIENT -->
<h3>Client</h3>
<div class="row">
  <div>
    <label>Nom & Prénom</label>
    <input id="clientNom">
  </div>
  <div>
    <label>Téléphone</label>
    <input id="clientTel">
  </div>
</div>

<div class="row">
  <div>
    <label>Email</label>
    <input id="clientEmail">
  </div>
  <div>
    <label>Entreprise</label>
    <input id="clientSociete">
  </div>
</div>

<label>Adresse prise en charge</label>
<input id="pickupAdr">

<label>Adresse livraison</label>
<input id="livAdr">

<label>Nature du colis</label>
<input id="nature">

<label>Remarques</label>
<textarea id="remarques"></textarea>

<button onclick="envoyerEmail()">📧 Envoyer par email</button>
<button class="secondary" onclick="envoyerWhatsapp()">📱 WhatsApp</button>
<button onclick="genererPDF()">📄 Télécharger le devis PDF</button>

<p class="small">Prix indicatif – confirmation avant prise en charge • &gt; 30 kg : devis spécial</p>

</div>

<script>
/* ========= PDF ========= */
function genererPDF(){
  if(!clientNom.value || !clientTel.value){
    alert("Merci de renseigner le nom et le téléphone.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 15;
  doc.setFontSize(16);
  doc.text("DEVIS – LÉMAN COURSES", 105, y, { align:"center" });
  y+=10;

  doc.setFontSize(10);
  doc.text("Transport express 24h/24 – 7j/7",105,y,{align:"center"});
  y+=10;

  doc.line(10,y,200,y); y+=10;

  doc.setFontSize(12);
  doc.text("CLIENT",10,y); y+=6;
  doc.setFontSize(10);
  doc.text(`Nom : ${clientNom.value}`,10,y); y+=5;
  doc.text(`Téléphone : ${clientTel.value}`,10,y); y+=10;

  doc.setFontSize(12);
  doc.text("TRAJET",10,y); y+=6;
  doc.setFontSize(10);
  doc.text(`NPA départ : ${npaDepart.value}`,10,y); y+=5;
  doc.text(`NPA arrivée : ${npaArrivee.value}`,10,y); y+=5;
  doc.text(`Distance : ${km.value} km`,10,y); y+=10;

  doc.setFontSize(12);
  doc.text("COLIS",10,y); y+=6;
  doc.setFontSize(10);
  doc.text(`Poids : ${poids.value} kg`,10,y); y+=5;
  doc.text(`Nature : ${nature.value}`,10,y); y+=10;

  doc.setFontSize(14);
  doc.text(`PRIX ESTIMÉ : ${prix.textContent}`,10,y);

  y+=12;
  doc.setFontSize(9);
  doc.text(
    "Prix indicatif – confirmation avant prise en charge.\nLéman Courses – Suisse romande",
    10,y
  );

  doc.save("Devis_Leman_Courses.pdf");
}
</script>

</body>
</html>
