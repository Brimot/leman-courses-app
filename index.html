<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Commande</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0B2A44;
  padding:20px;
  color:#fff;
}
.card{
  max-width:700px;
  margin:auto;
  background:#fff;
  color:#000;
  padding:20px;
  border-radius:14px;
}
h1{color:#0B2A44;margin-top:0}
label{font-weight:bold;font-size:13px}
input,select,button{
  width:100%;
  padding:10px;
  margin:6px 0 12px 0;
}
button{
  background:#0B2A44;
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
.price{
  font-size:26px;
  text-align:center;
  color:#0B2A44;
  margin:15px 0;
}
.notice{
  text-align:center;
  font-size:13px;
  color:green;
}
iframe{display:none;}
</style>
</head>

<body>

<div class="card">
<h1>Commande – Léman Courses</h1>

<form id="commandeForm"
      action="https://script.google.com/macros/s/AKfycby88Wpx7RoxGh_4iaoH66G5JfSri7HngXyBRJyiPSPS_fijMIw_pbqD7pjkviGeGHLi/exec"
      method="POST"
      target="hiddenFrame"
      onsubmit="envoyeOk()">

<label>Nom du client</label>
<input name="nom" required>

<label>Téléphone</label>
<input name="telephone" required>

<label>Adresse de prise en charge</label>
<input name="depart">

<label>Adresse de livraison</label>
<input name="arrivee">

<label>Poids du colis</label>
<select name="poids" onchange="calculerPrix()">
  <option value="5">0 – 5 kg</option>
  <option value="10">6 – 10 kg</option>
  <option value="20">11 – 20 kg</option>
  <option value="30">21 – 30 kg</option>
</select>

<input type="hidden" name="prix" id="prixHidden">

<div class="price" id="prix">CHF 25.–</div>

<button type="submit">Envoyer la commande</button>
</form>

<p id="retour" class="notice"></p>

<iframe name="hiddenFrame"></iframe>
</div>

<script>
function calculerPrix(){
  const p = Number(document.querySelector("[name=poids]").value);
  let prix = 25;
  if(p > 5) prix += 10;
  if(p > 10) prix += 15;
  if(p > 20) prix += 20;

  document.getElementById("prix").innerText = "CHF " + prix + ".–";
  document.getElementById("prixHidden").value = "CHF " + prix + ".–";
}

function envoyeOk(){
  document.getElementById("retour").innerText =
    "✅ Commande envoyée et enregistrée";
}

calculerPrix();
</script>

</body>
</html>
