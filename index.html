
<!DOCTYPE html>
<html lang="fr">
  
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A44">

<head>
  <meta charset="UTF-8">
  <title>Léman Courses – Calculateur express</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg,#0b2a4a,#0f3d6b);
      color: #fff;
      padding: 20px;
    }

    .card {
      max-width: 420px;
      margin: auto;
      background: #ffffff;
      color: #000;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #0b2a4a;
    }

    p {
      text-align: center;
      font-size: 14px;
      color: #444;
    }

    select, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      background: #f5b400;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e0a600;
    }

    .price {
      margin: 20px 0;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      color: #0b2a4a;
    }

    .actions button {
      margin-top: 10px;
      background: #0b2a4a;
      color: #fff;
    }

    .actions button.whatsapp {
      background: #25D366;
      color: #fff;
    }

    .actions button.mail {
      background: #555;
    }

    .phone-script {
      margin-top: 20px;
      font-size: 13px;
      background: #f2f2f2;
      padding: 12px;
      border-radius: 8px;
      color: #000;
    }
  </style>
</head>

  navigator.serviceWorker.register("./sw.js")

}
</script>
