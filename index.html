<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Devis transport</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0B2A44;
  margin:0;
  padding:20px;
}
.card{
  max-width:700px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:14px;
}
h1{text-align:center;color:#0B2A44;margin:0;}
.sub{text-align:center;color:#666;font-size:13px;margin-bottom:15px;}
label{font-weight:bold;font-size:13px;}
input,select,textarea,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #ccc;
}
textarea{min-height:60px;}
button{
  background:#0B2A44;
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
.price{
  font-size:28px;
  text-align:center;
  color:#0B2A44;
}
.small{text-align:center;font-size:11px;color:#555;}
.warning{text-align:center;color:red;font-weight:bold;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="card">

<h1>LÉMAN COURSES</h1>
<div class="sub">Transport express – Suisse romande</div>

<!-- TRAJET -->
<div class="row">
  <div>
    <label>NPA départ</label>
    <input id="npaDepart" placeholder="1000">
  </div>
  <div>
    <label>NPA arrivée</label>
    <input id="npaArrivee" placeholder="1200">
  </div>
</div>

<label>Distance & durée</label>
<input id="km" readonly placeholder="Calcul automatique…">
<div class="small" id="kmInfo"></div>

<!-- OPTIONS -->
<div class="row">
  <div>
    <label>Poids du colis (kg)</label>
    <input id="poids" type="number" min="1">
  </div>
  <div>
    <label>Service</label>
    <select id="service">
      <option value="Normal">Normal</option>
      <option value="Urgent">Urgent</option>
      <option value="Express">Express</option>
    </select>
  </div>
</div>

<div class="row">
  <div>
    <label>Horaire</label>
    <select id="horaire">
      <option value="Jour">Jour</option>
      <option value="Nuit">Nuit / Dimanche</option>
    </select>
  </div>
  <div>
    <label>Inter-villes</label>
    <select id="interville">
      <option value="Non">Non</option>
      <option value="Oui">Oui</option>
    </select>
  </div>
</div>

<div class="price" id="prix">CHF –.–</div>
<div class="small" id="prixDetail"></div>
<div class="warning" id="warning"></div>

<hr>

<!-- CLIENT -->
<h3>Client</h3>
<div class="row">
  <div><label>Nom & prénom</label><input id="clientNom"></div>
  <div><label>Téléphone</label><input id="clientTel"></div>
</div>

<label>Email</label>
<input id="clientEmail">

<label>Adresse prise en charge</label>
<input id="adrDepart">

<label>Adresse livraison</label>
<input id="adrArrivee">

<label>Nature du colis</label>
<input id="nature">

<label>Remarques</label>
<textarea id="remarques"></textarea>

<button onclick="envoyerEmail()">📧 Envoyer la commande</button>
<button onclick="genererPDF()">📄 Télécharger le devis PDF</button>

<p class="small">Prix indicatif – TVA 8.1 % incluse</p>

</div>

<script>
// ========= TARIFS =========
function coefPoids(p){
  if(p<=5) return 1;
  if(p<=10) return 1.1;
  if(p<=20) return 1.25;
  if(p<=30) return 1.4;
  return null;
}
function baseKm(km,service){
  if(km<=10) return service==="Normal"?35:service==="Urgent"?55:75;
  if(km<=30) return service==="Normal"?55:service==="Urgent"?85:115;
  if(km<=80) return service==="Normal"?75:service==="Urgent"?115:155;
  if(km<=150) return service==="Normal"?95:service==="Urgent"?145:195;
  if(km<=300) return service==="Normal"?125:service==="Urgent"?185:245;
  if(km<=600) return service==="Normal"?165:service==="Urgent"?245:325;
  return 205;
}

// ========= KM + DURÉE =========
async function calculKm(){
  if(!npaDepart.value||!npaArrivee.value) return;
  const geo=async npa=>{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ch&q=${npa}`);
    const d=await r.json(); return d[0]?[d[0].lon,d[0].lat]:null;
  };
  const A=await geo(npaDepart.value);
  const B=await geo(npaArrivee.value);
  if(!A||!B){kmInfo.textContent="NPA invalide";return;}
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${A[0]},${A[1]};${B[0]},${B[1]}?overview=false`);
  const d=await r.json();
  const kmCalc=Math.round(d.routes[0].distance/1000);
  const min=Math.round(d.routes[0].duration/60);
  km.value=kmCalc;
  kmInfo.textContent=`${kmCalc} km – ${Math.floor(min/60)}h${min%60}`;
  calculPrix();
}

// ========= PRIX =========
function calculPrix(){
  warning.textContent="";
  const k=Number(km.value);
  const p=Number(poids.value);
  if(!k||!p){prix.textContent="CHF –.–";return;}
  const coef=coefPoids(p);
  if(!coef){prix.textContent="DEVIS";warning.textContent="Colis > 30 kg";return;}
  let total=baseKm(k,service.value)*coef;
  if(horaire.value==="Nuit") total*=1.25;
  if(interville.value==="Oui"&&k>10) total+=k*1.2;
  total=Math.ceil(total/5)*5;
  const ht=total/1.081;
  const tva=total-ht;
  prix.textContent=`CHF ${total.toFixed(0)}.–`;
  prixDetail.textContent=`HT ${ht.toFixed(2)} CHF | TVA 8.1 % ${tva.toFixed(2)} CHF`;
}

// ========= EMAIL =========
function envoyerEmail(){
  if(!clientNom.value||!clientTel.value){alert("Nom et téléphone requis");return;}
  const body=`COMMANDE LÉMAN COURSES

Client : ${clientNom.value}
Téléphone : ${clientTel.value}
Email : ${clientEmail.value}

Trajet : ${npaDepart.value} → ${npaArrivee.value}
Distance : ${km.value} km
Poids : ${poids.value} kg
Service : ${service.value}

Prix : ${prix.textContent}

Adresse départ : ${adrDepart.value}
Adresse arrivée : ${adrArrivee.value}

Remarques :
${remarques.value}`;
  window.location.href=`mailto:info@leman-courses.ch?subject=Commande transport&body=${encodeURIComponent(body)}`;
}

// ========= PDF =========
function genererPDF(){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF();
  pdf.setFontSize(16);
  pdf.text("DEVIS – LÉMAN COURSES",105,15,{align:"center"});
  pdf.setFontSize(10);
  pdf.text(`Client : ${clientNom.value}`,10,35);
  pdf.text(`Téléphone : ${clientTel.value}`,10,42);
  pdf.text(`Trajet : ${npaDepart.value} → ${npaArrivee.value}`,10,52);
  pdf.text(`Distance : ${km.value} km`,10,59);
  pdf.text(`Poids : ${poids.value} kg`,10,66);
  pdf.text(`Prix TTC : ${prix.textContent}`,10,76);
  pdf.save("Devis_Leman_Courses.pdf");
}

// ========= EVENTS =========
[npaDepart,npaArrivee].forEach(e=>e.addEventListener("input",calculKm));
[poids,service,horaire,interville].forEach(e=>e.addEventListener("input",calculPrix));
</script>

</body>
</html>
