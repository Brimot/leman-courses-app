<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Commande</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #0b2a44;
  padding: 20px;
  color: #333;
}
.card {
  max-width: 420px;
  margin: auto;
  background: #fff;
  border-radius: 12px;
  padding: 20px;
}
h1 { text-align: center; }
label { display:block; margin-top:12px; font-weight:bold; }
input, select, textarea, button {
  width:100%;
  padding:10px;
  margin-top:6px;
}
button {
  background:#0b2a44;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
}
#prix {
  text-align:center;
  font-size:22px;
  margin-top:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
<h1>LÉMAN COURSES</h1>

<label>Nom du client</label>
<input id="clientNom">

<label>Téléphone</label>
<input id="clientTel">

<label>Email</label>
<input id="clientEmail">

<label>Code postal départ</label>
<input id="npaDepart">

<label>Code postal arrivée</label>
<input id="npaArrivee">

<label>Distance (km)</label>
<input id="km" type="number">

<label>Poids du colis (kg)</label>
<input id="poids" type="number">

<label>Service</label>
<select id="service">
  <option value="normal">Normal</option>
  <option value="urgent">Urgent</option>
  <option value="express">Express</option>
</select>

<div id="prix">CHF 0.–</div>

<button onclick="calculer()">Calculer</button>
<button onclick="envoyer()">Envoyer la commande</button>
</div>

<script>
function calculer() {
  const km = Number(kmInput.value);
  const poids = Number(poidsInput.value);
  const service = serviceSelect.value;

  if (!km || !poids) {
    prixDiv.textContent = "CHF 0.–";
    return;
  }

  if (poids > 30) {
    alert("Colis > 30 kg : devis spécial requis");
    return;
  }

  let base = 20;
  if (km > 10) base += (km - 10) * 1.2;

  let coefService = service === "urgent" ? 1.3 :
                    service === "express" ? 1.6 : 1;

  let coefPoids = poids <= 5 ? 1 :
                  poids <= 15 ? 1.2 : 1.4;

  let prix = base * coefService * coefPoids;
  prix = Math.round(prix / 5) * 5;

  prixDiv.textContent = "CHF " + prix + ".–";
}

async function envoyer() {
  const data = {
    clientNom: clientNom.value,
    clientTel: clientTel.value,
    clientEmail: clientEmail.value,
    npaDepart: npaDepart.value,
    npaArrivee: npaArrivee.value,
    distance: km.value + " km",
    poids: poids.value + " kg",
    service: service.value,
    prix: prixDiv.textContent
  };

  try {
    const response = await fetch(
      "https://script.google.com/macros/s/AKfycbz6N8J6gJRjLJhj3mIP6wf1kVvoloBsZKYSKBSWkOd3hywU2kEtUpOvxg83D8LXR_D-/exec",
      {
        method: "POST",
        body: JSON.stringify(data)
      }
    );

    const result = await response.text();
    alert("✅ Commande envoyée avec succès");

  } catch (err) {
    alert("❌ Erreur lors de l’envoi");
    console.error(err);
  }
}


/* références */
const kmInput = document.getElementById("km");
const poidsInput = document.getElementById("poids");
const serviceSelect = document.getElementById("service");
const prixDiv = document.getElementById("prix");

[kmInput, poidsInput, serviceSelect].forEach(el =>
  el.addEventListener("input", calculer)
);
</script>

</body>
</html>
