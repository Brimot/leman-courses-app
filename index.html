
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>LÉMAN COURSES – Commande</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#0b2a44,#0f3d66);
  color:#fff;
  padding:20px;
}
.card{
  max-width:520px;
  margin:auto;
  background:#fff;
  color:#000;
  border-radius:16px;
  padding:20px;
}
h1{text-align:center;color:#0b2a44;}
label{font-weight:bold;font-size:13px;}
input,select,button{
  width:100%;
  margin-top:6px;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  background:#0b2a44;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
.price{
  font-size:28px;
  text-align:center;
  margin:15px 0;
  color:#0b2a44;
}
.info{
  font-size:12px;
  background:#f2f2f2;
  padding:10px;
  border-radius:8px;
}
.section{
  margin-top:15px;
  border-top:1px solid #ddd;
  padding-top:15px;
}
</style>
</head>

<body>

<div class="card">
<h1>LÉMAN COURSES</h1>

<!-- CODES POSTAUX -->
<div class="section">
<label>NPA prise en charge</label>
<input id="cpStart" placeholder="Ex: 1000">

<label>NPA livraison</label>
<input id="cpEnd" placeholder="Ex: 1200">
</div>

<!-- OPTIONS -->
<div class="section">
<label>Poids du colis (kg)</label>
<input type="number" id="poids">

<label>Service</label>
<select id="service">
<option value="normal">Normal</option>
<option value="urgent">Urgent</option>
<option value="express">Express</option>
</select>

<label>Période</label>
<select id="horaire">
<option value="jour">Jour</option>
<option value="nuit">Nuit / Dimanche</option>
</select>

<button onclick="calculate()">Calculer le tarif</button>
</div>

<div class="price" id="result">CHF —</div>
<div class="info" id="detail"></div>

<!-- FORMULAIRE CLIENT -->
<div class="section">
<h3>📦 Données client</h3>

<label>Nom / Prénom</label>
<input id="clientNom">

<label>Téléphone</label>
<input id="clientTel">

<label>Adresse complète</label>
<input id="clientAdr">

<h3>📍 Livraison</h3>

<label>Nom / Prénom</label>
<input id="livNom">

<label>Adresse complète</label>
<input id="livAdr">

<label>Nature du colis</label>
<input id="nature">

<button id="sendBtn" disabled>Envoyer la commande</button>
</div>

</div>

<script>
// GRILLE TARIFAIRE
const grille=[
{min:0,max:10,normal:6.5,urgent:43,express:30},
{min:11,max:30,normal:10,urgent:73,express:48},
{min:31,max:80,normal:13.5,urgent:103,express:66},
{min:81,max:150,normal:17,urgent:133,express:84},
{min:151,max:250,normal:20.5,urgent:163,express:102},
{min:251,max:500,normal:38,urgent:313,express:192},
{min:501,max:1500,normal:108,urgent:913,express:552}
];

function coefPoids(p){
if(p<=5) return 1;
if(p<=10) return 1.1;
if(p<=20) return 1.25;
if(p<=30) return 1.4;
return null;
}

// CALCUL DISTANCE VIA OSRM
async function getKm(cp1,cp2){
const geo = async cp =>{
const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${cp},Switzerland`);
const d=await r.json();
return [d[0].lon,d[0].lat];
};
const a=await geo(cp1);
const b=await geo(cp2);
const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a[0]},${a[1]};${b[0]},${b[1]}?overview=false`);
const d=await r.json();
return d.routes[0].distance/1000;
}

async function calculate(){
const cp1=cpStart.value;
const cp2=cpEnd.value;
const poids=Number(poidsInput=poids.value);
const service=serviceSelect=service.value;
const horaire=horaireSelect=horaire.value;

if(poids>30){
alert("Colis > 30 kg : devis spécial requis");
return;
}

const km=Math.round(await getKm(cp1,cp2));
const row=grille.find(g=>km>=g.min && km<=g.max);
if(!row){result.textContent="Devis requis";return;}

let prix=row[service];
if(horaire==="nuit") prix*=1.25;
prix*=coefPoids(poids);
prix=Math.round(prix/5)*5;

result.textContent=`CHF ${prix}.-`;
detail.textContent=`Distance ${km} km | ${service.toUpperCase()} | ${poids} kg`;
sendBtn.disabled=false;
}
</script>

</body>
</html>
