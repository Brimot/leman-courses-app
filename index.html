<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Calculateur express</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A44">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(135deg,#0b2a44,#0f3d66);
  padding:20px;
}
.card{
  max-width:460px;
  margin:auto;
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
h1{
  text-align:center;
  color:#0b2a44;
}
p{
  text-align:center;
  font-size:13px;
  color:#555;
}
select,input,button{
  width:100%;
  margin-top:12px;
  padding:14px;
  font-size:15px;
  border-radius:10px;
  border:1px solid #ccc;
}
button{
  background:#0b2a44;
  color:#fff;
  font-weight:bold;
  border:none;
  cursor:pointer;
}
button:hover{background:#09335f}
.price{
  margin-top:20px;
  font-size:26px;
  text-align:center;
  color:#0b2a44;
  font-weight:bold;
}
.small{
  font-size:11px;
  color:#666;
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="card">
<h1>LÉMAN COURSES</h1>
<p>Transport express 24h/24 – 7j/7</p>

<select id="type">
  <option value="35">Course locale</option>
  <option value="65">Course inter-villes</option>
</select>

<input type="number" id="km" placeholder="Distance (km – inter-villes)" min="0">

<select id="urgence">
  <option value="0">Standard</option>
  <option value="10">Urgent (+10%)</option>
  <option value="25">Express (+25%)</option>
</select>

<select id="horaire">
  <option value="1">Jour</option>
  <option value="1.25">Nuit (+25%)</option>
  <option value="1.3">Dimanche / férié (+30%)</option>
</select>

<button onclick="calculer()">Calculer le tarif</button>

<div class="price" id="resultat">CHF 35.–</div>

<button id="pdfBtn">Générer le devis PDF</button>

<div class="small">
Prix indicatif – confirmation avant la course
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const typeEl = document.getElementById("type")
const kmEl = document.getElementById("km")
const urgenceEl = document.getElementById("urgence")
const horaireEl = document.getElementById("horaire")
const resultatEl = document.getElementById("resultat")

function arrondi5(v){ return Math.round(v/5)*5 }

function calculer(){
  const base = parseFloat(typeEl.value)
  const km = parseFloat(kmEl.value) || 0
  const urgence = parseFloat(urgenceEl.value)
  const horaire = parseFloat(horaireEl.value)

  let supplementKm = 0
  if(base === 65 && km > 10){
    supplementKm = (km - 10) * 2.5
  }

  let prix = (base + supplementKm) * (1 + urgence/100) * horaire
  prix = arrondi5(prix)

  resultatEl.innerText = "CHF " + prix + ".–"
  return { base, km, supplementKm, urgence, horaire, prix }
}

function genererPDF(){
  const d = calculer()
  const { jsPDF } = window.jspdf
  const doc = new jsPDF()
  const date = new Date().toLocaleDateString("fr-CH")

  doc.setFontSize(16)
  doc.text("DEVIS – LÉMAN COURSES",20,20)

  doc.setFontSize(11)
  doc.text(`Date : ${date}`,20,35)
  doc.text(`Type : ${d.base===35?"Locale":"Inter-villes"}`,20,45)
  doc.text(`Distance : ${d.km} km`,20,55)
  doc.text(`Supplément km : CHF ${d.supplementKm}`,20,65)
  doc.text(`Urgence : ${d.urgence}%`,20,75)
  doc.text(`Horaire : x${d.horaire}`,20,85)

  doc.setFontSize(14)
  doc.text(`TOTAL : CHF ${d.prix}.–`,20,105)

  doc.setFontSize(10)
  doc.text(
    "Prix indicatif. Devis confirmé avant la course.\nLéman Courses – Transport express 24h/24 – 7j/7",
    20,125
  )

  doc.save("Devis_Leman_Courses.pdf")
}

[typeEl, kmEl, urgenceEl, horaireEl].forEach(el=>{
  el.addEventListener("input", calculer)
})

document.getElementById("pdfBtn").addEventListener("click", genererPDF)

calculer()

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js")
}
</script>

</body>
</html>
