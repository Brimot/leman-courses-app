<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Commande transport</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#0B2A44,#0F3D5E);
  padding:20px;
  color:#fff;
}
.card{
  max-width:520px;
  margin:auto;
  background:#fff;
  color:#000;
  border-radius:16px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.3);
}
h1{text-align:center;color:#0B2A44;}
p{text-align:center;color:#444;}
label{font-weight:bold;font-size:13px;}
input,select,textarea,button{
  width:100%;
  margin-top:6px;
  margin-bottom:14px;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}
button{
  background:#0B2A44;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
button.secondary{background:#25D366;}
.price{
  text-align:center;
  font-size:26px;
  font-weight:bold;
  color:#0B2A44;
  margin:10px 0;
}
.detail{
  font-size:13px;
  color:#333;
  text-align:center;
}
.warning{
  color:red;
  font-weight:bold;
  text-align:center;
}
</style>
</head>

<body>
<div class="card">

<h1>LÉMAN COURSES</h1>
<p>Transport express 24h/24 – 7j/7</p>

<!-- CLIENT -->
<label>Nom & Prénom</label>
<input id="clientNom">

<label>Téléphone</label>
<input id="clientTel">

<label>Email (optionnel)</label>
<input id="clientEmail">

<label>Entreprise (optionnel)</label>
<input id="clientSociete">

<!-- COLIS -->
<label>Poids du colis (kg)</label>
<input type="number" id="poids" min="1">

<label>Nature du colis</label>
<input id="nature">

<!-- DISTANCE -->
<label>Distance estimée (km)</label>
<input type="number" id="km">

<label>Inter-villes ?</label>
<select id="interville">
  <option value="non">Non</option>
  <option value="oui">Oui</option>
</select>

<!-- SERVICE -->
<label>Service</label>
<select id="service">
  <option value="normal">Normal</option>
  <option value="urgent">Urgent</option>
  <option value="express">Express</option>
</select>

<label>Horaire</label>
<select id="horaire">
  <option value="jour">Jour</option>
  <option value="nuit">Nuit / Dimanche</option>
</select>

<div class="price" id="prix">CHF –.–</div>
<div class="detail" id="detail"></div>
<div class="warning" id="warning"></div>

<button onclick="envoyerEmail()">Envoyer la commande par email</button>
<button class="secondary" onclick="envoyerWhatsapp()">Envoyer par WhatsApp</button>

<p style="font-size:11px;text-align:center;color:#666">
Prix indicatif – confirmation avant prise en charge
</p>

</div>

<script>
const kmInput = document.getElementById("km");
const poidsInput = document.getElementById("poids");
const serviceInput = document.getElementById("service");
const horaireInput = document.getElementById("horaire");
const intervilleInput = document.getElementById("interville");
const prixEl = document.getElementById("prix");
const detailEl = document.getElementById("detail");
const warningEl = document.getElementById("warning");

function coefPoids(p){
  if(p<=5) return 1;
  if(p<=10) return 1.1;
  if(p<=20) return 1.25;
  if(p<=30) return 1.4;
  return null;
}

function baseKm(km,service){
  if(km<=10) return service==="normal"?6.5:service==="urgent"?43:30;
  if(km<=30) return service==="normal"?10:service==="urgent"?73:48;
  if(km<=80) return service==="normal"?13.5:service==="urgent"?103:66;
  if(km<=150) return service==="normal"?17:service==="urgent"?133:84;
  if(km<=300) return service==="normal"?24:service==="urgent"?193:120;
  return null;
}

function updatePrix(){
  const km = Number(kmInput.value);
  const poids = Number(poidsInput.value);
  const service = serviceInput.value;
  const horaire = horaireInput.value;

  warningEl.textContent="";

  if(!km || !poids) return;

  const coef = coefPoids(poids);
  if(!coef){
    prixEl.textContent="DEVIS";
    warningEl.textContent="⚠️ Colis > 30 kg – devis spécial requis";
    return;
  }

  let base = baseKm(km,service);
  if(base===null){
    prixEl.textContent="DEVIS";
    warningEl.textContent="Distance hors grille – devis requis";
    return;
  }

  let prix = base * coef;
  if(horaire==="nuit") prix*=1.25;
  if(intervilleInput.value==="oui") prix+=km*1.2;

  prix = Math.round(prix/5)*5;

  prixEl.textContent=`CHF ${prix}.–`;
  detailEl.textContent=`${km} km – ${poids} kg – ${service.toUpperCase()}`;
}

[kmInput,poidsInput,serviceInput,horaireInput,intervilleInput]
.forEach(el=>el.addEventListener("input",updatePrix));

function messageCommande(){
  return `
Commande Léman Courses

Client: ${clientNom.value}
Téléphone: ${clientTel.value}
Entreprise: ${clientSociete.value}

Colis: ${poids.value} kg
Nature: ${nature.value}

Distance: ${km.value} km
Inter-villes: ${interville.value}
Service: ${service.value}
Horaire: ${horaire.value}

Prix estimé: ${prixEl.textContent}
`;
}

function envoyerEmail(){
  window.location.href =
  "mailto:info@leman-courses.ch?subject=Commande Léman Courses&body="
  + encodeURIComponent(messageCommande());
}

function envoyerWhatsapp(){
  window.open(
  "https://wa.me/?text="+encodeURIComponent(messageCommande()),
  "_blank");
}
</script>

</body>
</html>
