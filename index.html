<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>LÉMAN COURSES – Commande transport</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#0b2a44,#0f3d66);
  color:#fff;
  padding:20px;
}
.card{
  max-width:600px;
  margin:auto;
  background:#fff;
  color:#000;
  border-radius:16px;
  padding:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
}
h1{text-align:center;color:#0b2a44;margin-top:0;}
.section{margin-top:20px;border-top:1px solid #ddd;padding-top:15px;}
label{font-weight:bold;font-size:13px;}
input,select,button{
  width:100%;
  margin-top:6px;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  background:#0b2a44;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{background:#999;}
.price{
  font-size:30px;
  text-align:center;
  margin:20px 0;
  color:#0b2a44;
}
.info{
  font-size:12px;
  background:#f2f2f2;
  padding:10px;
  border-radius:8px;
}
.small{font-size:11px;color:#555;text-align:center;margin-top:10px;}
</style>
</head>

<body>

<div class="card">
<h1>LÉMAN COURSES</h1>

<!-- CODES POSTAUX -->
<div class="section">
<label>NPA prise en charge</label>
<input id="cpStart" placeholder="Ex : 1000 Lausanne">

<label>NPA livraison</label>
<input id="cpEnd" placeholder="Ex : 1200 Genève">
</div>

<!-- OPTIONS -->
<div class="section">
<label>Poids du colis (kg)</label>
<input type="number" id="poids" min="1" placeholder="Max 30 kg">

<label>Type de service</label>
<select id="service">
  <option value="normal">Normal</option>
  <option value="urgent">Urgent</option>
  <option value="express">Express</option>
</select>

<label>Période</label>
<select id="horaire">
  <option value="jour">Jour</option>
  <option value="nuit">Nuit / Dimanche</option>
</select>

<button onclick="calculer()">Calculer le tarif</button>
</div>

<div class="price" id="result">CHF —</div>
<div class="info" id="detail"></div>

<!-- CLIENT -->
<div class="section">
<h3>📦 Client</h3>

<label>Nom / Prénom</label>
<input id="clientNom">

<label>Téléphone</label>
<input id="clientTel">

<label>Adresse prise en charge</label>
<input id="pickupAdr">
</div>

<!-- LIVRAISON -->
<div class="section">
<h3>📍 Livraison</h3>

<label>Nom / Prénom</label>
<input id="livNom">

<label>Adresse livraison</label>
<input id="livAdr">

<label>Nature du colis</label>
<input id="nature">

<button id="sendBtn" onclick="envoyerCommande()" disabled>
  Envoyer la commande
</button>


<p class="small">
Prix indicatif – confirmation avant la prise en charge du colis
</p>

</div>

<script>
// ===== RÉFÉRENCES =====
const cpStart = document.getElementById("cpStart");
const cpEnd = document.getElementById("cpEnd");
const poidsInput = document.getElementById("poids");
const serviceSelect = document.getElementById("service");
const horaireSelect = document.getElementById("horaire");
const result = document.getElementById("result");
const detail = document.getElementById("detail");
const sendBtn = document.getElementById("sendBtn");

// ===== GRILLE TARIFAIRE KM (INTERNE) =====
const grille = [
  {min:0,max:10,normal:45,urgent:65,express:85},
  {min:11,max:30,normal:65,urgent:95,express:125},
  {min:31,max:80,normal:85,urgent:125,express:165},
  {min:81,max:150,normal:105,urgent:155,express:205},
  {min:151,max:300,normal:135,urgent:195,express:255},
  {min:301,max:600,normal:175,urgent:255,express:335},
  {min:601,max:1500,normal:215,urgent:315,express:415}
];

// ===== RÈGLE POIDS (COEF + SUPPLÉMENT) =====
function reglePoids(p){
  if(p <= 5)  return {coef:1.00, sup:0};
  if(p <= 10) return {coef:1.10, sup:5};
  if(p <= 20) return {coef:1.25, sup:10};
  if(p <= 30) return {coef:1.40, sup:20};
  return null;
}

// ===== CALCUL DISTANCE (OSM) =====
async function getKm(cp1, cp2){
  const geo = async cp => {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(cp)},Switzerland`
    );
    const d = await r.json();
    return d[0] ? [d[0].lon, d[0].lat] : null;
  };

  const A = await geo(cp1);
  const B = await geo(cp2);
  if(!A || !B) return null;

  const r = await fetch(
    `https://router.project-osrm.org/route/v1/driving/${A[0]},${A[1]};${B[0]},${B[1]}?overview=false`
  );
  const d = await r.json();
  return Math.round(d.routes[0].distance / 1000);
}

// ===== CALCUL TARIF =====
async function calculer(){
  const poids = Number(poidsInput.value);
  const service = serviceSelect.value;
  const horaire = horaireSelect.value;
  

  if(!cpStart.value || !cpEnd.value || !poids){
    alert("Merci de compléter les champs nécessaires");
    return;
  }

  if(poids > 30){
    alert("⚠️ Colis > 30 kg : devis spécial requis");
    result.textContent = "Devis requis";
    sendBtn.disabled = true;
    return;
  }

  result.textContent = "Calcul en cours…";
  function envoyerCommande() {
  const clientNom = document.getElementById("clientNom").value;
  const clientTel = document.getElementById("clientTel").value;
  const pickupAdr = document.getElementById("pickupAdr").value;
  const livNom = document.getElementById("livNom").value;
  const livAdr = document.getElementById("livAdr").value;
  const nature = document.getElementById("nature").value;

  if (!clientNom || !clientTel) {
    alert("Merci de compléter au minimum le nom et le téléphone.");
    return;
  }

  const sujet = "Nouvelle commande – Léman Courses";

  const corps = `
NOUVELLE COMMANDE – LÉMAN COURSES

CLIENT
Nom : ${clientNom}
Téléphone : ${clientTel}

PRISE EN CHARGE
Adresse : ${pickupAdr}
NPA départ : ${cpStart.value}

LIVRAISON
Nom : ${livNom}
Adresse : ${livAdr}
NPA arrivée : ${cpEnd.value}

COLIS
Nature : ${nature}
Poids : ${poidsInput.value} kg

SERVICE
Type : ${serviceSelect.value.toUpperCase()}
Période : ${horaireSelect.value}

TARIF
${result.textContent}

NOTE
Prix indicatif – confirmation avant prise en charge
`;

  const mailto = 
    "mailto:info@leman-courses.ch" +
    "?subject=" + encodeURIComponent(sujet) +
    "&body=" + encodeURIComponent(corps);

  window.location.href = mailto;
}


  const km = await getKm(cpStart.value, cpEnd.value);
  if(km === null){
    result.textContent = "Erreur calcul distance";
    return;
  }

  const ligne = grille.find(g => km >= g.min && km <= g.max);
  if(!ligne){
    result.textContent = "Distance hors grille";
    return;
  }

  let prix = ligne[service];

  if(horaire === "nuit") prix *= 1.25;

  const rPoids = reglePoids(poids);
  prix = prix * rPoids.coef + rPoids.sup;

  prix = Math.ceil(prix / 5) * 5;

  result.textContent = `CHF ${prix}.–`;
  detail.textContent = `Distance : ${km} km · ${service.toUpperCase()} · ${poids} kg`;

  sendBtn.disabled = false;
}
</script>

</body>
</html>
