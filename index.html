<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Commande transport express</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#0b2a44,#0f3d66);
  padding:20px;
  color:#fff;
}
.wrap{max-width:1000px;margin:auto}
h1{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

.card{
  background:#fff;
  color:#000;
  border-radius:16px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.25)
}

label{font-size:12px;color:#555}
input,select,textarea,button{
  width:100%;
  margin-top:6px;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:14px;
  box-sizing:border-box
}
textarea{min-height:80px}

button{
  background:#0b2a44;
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer
}
button:disabled{opacity:.5}

.price{
  font-size:28px;
  font-weight:bold;
  color:#0b2a44;
  margin-top:10px
}

.note{font-size:12px;color:#666;margin-top:6px}
.status{font-size:12px;margin-top:8px}
</style>
</head>

<body>
<div class="wrap">
<h1>LÉMAN COURSES</h1>

<div class="grid">

<!-- COMMANDE -->
<div class="card">
<h2>Commande</h2>

<label>Nom du client</label>
<input id="clientNom">

<label>Téléphone</label>
<input id="clientTel">

<label>Email client (optionnel)</label>
<input id="clientEmail">

<hr>

<h3>Prise en charge</h3>
<label>Entreprise</label>
<input id="pickupEntreprise">
<label>Adresse</label>
<input id="pickupAdresse">
<label>NPA</label>
<input id="pickupNPA">
<label>Ville</label>
<input id="pickupVille">

<hr>

<h3>Livraison</h3>
<label>Entreprise</label>
<input id="dropEntreprise">
<label>Adresse</label>
<input id="dropAdresse">
<label>NPA</label>
<input id="dropNPA">
<label>Ville</label>
<input id="dropVille">

<label>Remarques</label>
<textarea id="remarques"></textarea>
</div>

<!-- TARIF -->
<div class="card">
<h2>Tarif & distance</h2>

<label>Urgence</label>
<select id="urgence">
  <option value="0">Standard</option>
  <option value="10">Urgent +10%</option>
  <option value="25">Express +25%</option>
</select>

<label>Horaire</label>
<select id="horaire">
  <option value="1">Jour</option>
  <option value="1.25">Nuit</option>
  <option value="1.3">Dimanche / férié</option>
</select>

<label>Kilomètres (auto)</label>
<input id="km" disabled>

<div class="status" id="kmStatus">En attente des adresses…</div>

<div class="price" id="resultat">CHF 0.–</div>
<div class="note" id="detail"></div>

<button id="sendBtn" disabled>📧 Envoyer commande + PDF</button>
</div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const DISPATCH_EMAIL = "TONEMAIL@lemancourses.ch"; // ⬅️ À MODIFIER
const { jsPDF } = window.jspdf;

let currentKm = 0;

function round5(v){ return Math.round(v/5)*5 }

// 🔹 CALCUL PRIX (TOUJOURS)
function updatePrice(){
  let base = 35;
  let kmPrice = 0;

  if(currentKm > 10){
    base = 65;
    kmPrice = currentKm * 1.2;
    detail.textContent = `Inter-villes · ${currentKm} km × 1.20 CHF`;
  }else{
    detail.textContent = `Course locale (≤ 10 km)`;
  }

  let prix = (base + kmPrice) * (1 + urgence.value/100) * horaire.value;
  prix = round5(prix);

  resultat.textContent = `CHF ${prix}.–`;
  sendBtn.disabled = false;
  return prix;
}

// 🔹 CALCUL KM
async function computeKm(){
  if(!pickupVille.value || !dropVille.value) return;

  kmStatus.textContent="Calcul de la distance…";

  const geo = async q => {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ch&q=${encodeURIComponent(q)}`);
    const d = await r.json();
    return d[0] ? {lat:d[0].lat,lon:d[0].lon} : null;
  };

  const q1 = `${pickupAdresse.value}, ${pickupNPA.value} ${pickupVille.value}, Suisse`;
  const q2 = `${dropAdresse.value}, ${dropNPA.value} ${dropVille.value}, Suisse`;

  const A = await geo(q1);
  const B = await geo(q2);
  if(!A || !B){ kmStatus.textContent="Adresse invalide"; return; }

  const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${A.lon},${A.lat};${B.lon},${B.lat}?overview=false`);
  const d = await r.json();

  currentKm = Math.round((d.routes[0].distance/1000)*10)/10;
  km.value = currentKm;
  kmStatus.textContent = `Distance calculée : ${currentKm} km`;

  updatePrice();
}

// 🔹 PDF
function generatePDF(prix){
  const doc = new jsPDF();
  doc.setFontSize(16);
  doc.text("DEVIS – LÉMAN COURSES",20,20);

  doc.setFontSize(11);
  doc.text(`Client : ${clientNom.value}`,20,35);
  doc.text(`Téléphone : ${clientTel.value}`,20,45);

  doc.text("PRISE EN CHARGE",20,60);
  doc.text(`${pickupEntreprise.value}`,20,70);
  doc.text(`${pickupAdresse.value}`,20,78);
  doc.text(`${pickupNPA.value} ${pickupVille.value}`,20,86);

  doc.text("LIVRAISON",20,100);
  doc.text(`${dropEntreprise.value}`,20,110);
  doc.text(`${dropAdresse.value}`,20,118);
  doc.text(`${dropNPA.value} ${dropVille.value}`,20,126);

  doc.setFontSize(14);
  doc.text(`TOTAL ESTIMÉ : CHF ${prix}.–`,20,150);

  doc.save("Devis_Leman_Courses.pdf");
}

// 🔹 EMAIL
sendBtn.onclick = ()=>{
  const prix = updatePrice();
  generatePDF(prix);

  const body = `
COMMANDE LÉMAN COURSES

Client : ${clientNom.value}
Téléphone : ${clientTel.value}

PRISE EN CHARGE
${pickupEntreprise.value}
${pickupAdresse.value}
${pickupNPA.value} ${pickupVille.value}

LIVRAISON
${dropEntreprise.value}
${dropAdresse.value}
${dropNPA.value} ${dropVille.value}

Distance : ${currentKm} km
Prix estimé : CHF ${prix}.–

Remarques :
${remarques.value}
`;

  location.href = `mailto:${DISPATCH_EMAIL}?subject=Commande Léman Courses&body=${encodeURIComponent(body)}`;
};

// LISTENERS
["pickupAdresse","pickupNPA","pickupVille","dropAdresse","dropNPA","dropVille"]
.forEach(id=>document.getElementById(id).addEventListener("input",()=>setTimeout(computeKm,800)));

["urgence","horaire"].forEach(id=>document.getElementById(id).addEventListener("change", updatePrice));
</script>
</body>
</html>
