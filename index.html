<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Commande</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0b2a44,#0f3d63);
  padding:20px;
}
.card{
  max-width:520px;
  margin:auto;
  background:#fff;
  border-radius:16px;
  padding:20px;
}
h1{text-align:center;color:#0b2a44}
label{font-weight:bold;margin-top:10px;display:block}
input,select,textarea,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  background:#0b2a44;
  color:#fff;
  font-weight:bold;
  margin-top:16px;
  cursor:pointer;
}
.note{
  font-size:12px;
  color:#666;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="card">
<h1>LÉMAN COURSES</h1>

<form id="orderForm">

<label>Nom & Prénom</label>
<input required id="clientNom">

<label>Téléphone</label>
<input required id="clientTel">

<label>Email</label>
<input type="email" id="clientEmail">

<label>Adresse de départ</label>
<input required id="adrDepart">

<label>Adresse de livraison</label>
<input required id="adrArrivee">

<label>Poids du colis (kg)</label>
<input type="number" id="poids" min="1" max="30" required>

<label>Service</label>
<select id="service">
  <option value="Normal">Normal</option>
  <option value="Urgent">Urgent</option>
  <option value="Express">Express</option>
</select>

<label>Remarques</label>
<textarea id="remarques"></textarea>

<button type="submit">Envoyer la commande</button>

<p class="note">
Prix indicatif – confirmation avant prise en charge
</p>

</form>
</div>

<script>
document.getElementById("orderForm").addEventListener("submit", async e=>{
  e.preventDefault();

  const data = {
    clientNom: clientNom.value,
    clientTel: clientTel.value,
    clientEmail: clientEmail.value,
    adrDepart: adrDepart.value,
    adrArrivee: adrArrivee.value,
    poids: poids.value,
    service: service.value,
    remarques: remarques.value
  };

  await fetch("https://script.google.com/macros/s/AKfycbz6N8J6gJRjLJhj3mIP6wf1kVvoloBsZKYSKBSWkOd3hywU2kEtUpOvxg83D8LXR_D-/exec",{
    method:"POST",
    body: JSON.stringify(data)
  });

  alert("Commande envoyée ✔️\nUn email + WhatsApp sont prêts");
});
</script>

</body>
</html>
