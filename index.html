<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Devis transport</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0B2A44;
  margin:0;
  padding:20px;
}
.card{
  max-width:780px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:14px;
}
h1{text-align:center;color:#0B2A44;margin:0;}
.sub{text-align:center;color:#666;font-size:13px;margin-bottom:15px;}
label{font-weight:bold;font-size:13px;}
input,select,textarea,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #ccc;
}
textarea{min-height:70px;}
button{
  background:#0B2A44;
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
.price{font-size:28px;text-align:center;color:#0B2A44;}
.infoTop{
  text-align:center;
  font-weight:bold;
  margin-bottom:10px;
}
.infoSub{
  text-align:center;
  font-size:11px;
  color:#666;
}
.small{text-align:center;font-size:11px;color:#555;}
.warning{text-align:center;color:red;font-weight:bold;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.row{grid-template-columns:1fr}}

#mapPopup{
  display:none;
  position:fixed;
  inset:0;
  background:#000000cc;
  z-index:9999;
}
#mapHeader{
  position:absolute;
  top:0; left:0;
  width:100%;
  background:#fff;
  padding:14px;
  font-weight:bold;
  cursor:pointer;
  z-index:10000;
}
#map{
  width:100%;
  height:100%;
}
.mapInfo{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#fff;
  padding:10px 16px;
  border-radius:10px;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="card">

<h1>LÉMAN COURSES</h1>
<div class="sub">Transport express – Suisse romande</div>

<div class="infoTop" id="topInfo">Distance : – km • Temps estimé : –</div>
<div class="infoSub">
Temps de trajet donné à titre indicatif, susceptible de varier selon les conditions de circulation.
</div>

<div class="row">
  <div><label>NPA départ</label><input id="npaDepart"></div>
  <div><label>NPA arrivée</label><input id="npaArrivee"></div>
</div>

<label>Détails calcul</label>
<input id="km" readonly>

<div class="row">
  <div><label>Poids (kg)</label><input id="poids" type="number"></div>
  <div>
    <label>Service</label>
    <select id="service">
      <option>Normal</option>
      <option>Urgent</option>
      <option>Express</option>
    </select>
  </div>
</div>

<div class="price" id="prix">CHF –.–</div>
<div class="small" id="prixDetail"></div>
<div class="warning" id="warning"></div>

<button id="btnMap" style="display:none;" onclick="openMap()">🗺️ Voir le trajet</button>

<hr>

<h3>Client</h3>
<div class="row">
  <div><label>Nom</label><input id="clientNom"></div>
  <div><label>Téléphone</label><input id="clientTel"></div>
</div>

<label>Email</label><input id="clientEmail">
<label>Adresse départ</label><input id="adrDepart">
<label>Adresse arrivée</label><input id="adrArrivee">

<button onclick="envoyerEmail()">📧 Envoyer</button>
<button onclick="genererPDF()">📄 Devis PDF</button>

<p class="small">TVA 8.1 % incluse</p>
</div>

<!-- POPUP CARTE -->
<div id="mapPopup">
  <div id="mapHeader" onclick="closeMap()">← Retour au calculateur</div>
  <div id="map"></div>
  <div class="mapInfo" id="mapInfo"></div>
</div>

<script>
// =================== VARIABLES ===================
let coordA=null, coordB=null;
let map, routeLayer;
let dureeMin=0;
let isInterville=false;

// =================== TARIFS ===================
function coefPoids(p){
  if(p<=5) return 1;
  if(p<=10) return 1.1;
  if(p<=20) return 1.25;
  if(p<=30) return 1.4;
  return null;
}
function baseKm(km,s){
  if(km<=10) return s==="Normal"?35:s==="Urgent"?55:75;
  if(km<=30) return s==="Normal"?55:s==="Urgent"?85:115;
  if(km<=80) return s==="Normal"?75:s==="Urgent"?115:155;
  if(km<=150) return s==="Normal"?95:s==="Urgent"?145:195;
  if(km<=300) return s==="Normal"?125:s==="Urgent"?185:245;
  return 165;
}

// =================== KM + DURÉE ===================
async function calculKm(){
  if(!npaDepart.value||!npaArrivee.value) return;

  const geo=async npa=>{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ch&q=${npa}`);
    const d=await r.json();
    return d[0]?[d[0].lon,d[0].lat]:null;
  };

  coordA=await geo(npaDepart.value);
  coordB=await geo(npaArrivee.value);
  if(!coordA||!coordB){return;}

  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${coordA[0]},${coordA[1]};${coordB[0]},${coordB[1]}?overview=full&geometries=geojson`);
  const d=await r.json();

  const kmCalc=Math.round(d.routes[0].distance/1000);
  dureeMin=Math.round(d.routes[0].duration/60);

  km.value=`${kmCalc} km – ${Math.floor(dureeMin/60)}h${dureeMin%60}`;
  document.getElementById("topInfo").textContent =
    `Distance : ${kmCalc} km • Temps estimé : ${Math.floor(dureeMin/60)}h${dureeMin%60}`;

  isInterville = kmCalc>10;
  window.routeGeo=d.routes[0].geometry;
  document.getElementById("btnMap").style.display="block";

  calculPrix(kmCalc);
}

// =================== PRIX ===================
function calculPrix(k){
  const p=Number(poids.value);
  if(!k||!p){prix.textContent="CHF –.–";return;}
  const c=coefPoids(p);
  if(!c){prix.textContent="DEVIS";warning.textContent=">30 kg";return;}
  let t=baseKm(k,service.value)*c;
  if(isInterville) t+=k*1.2;
  t=Math.ceil(t/5)*5;
  const ht=t/1.081, tva=t-ht;
  prix.textContent=`CHF ${t}.–`;
  prixDetail.textContent=`HT ${ht.toFixed(2)} + TVA ${tva.toFixed(2)}`;
}

// =================== MAP ===================
function openMap(){
  document.getElementById("mapPopup").style.display="block";
  setTimeout(()=>{
    if(!map){
      map=L.map("map");
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
    }
    if(routeLayer) map.removeLayer(routeLayer);

    routeLayer=L.geoJSON(window.routeGeo,{style:{color:"red",weight:4}}).addTo(map);
    map.fitBounds(routeLayer.getBounds(),{padding:[50,50]});

    L.marker([coordA[1],coordA[0]]).addTo(map).bindPopup("Départ");
    L.marker([coordB[1],coordB[0]]).addTo(map).bindPopup("Arrivée");

    document.getElementById("mapInfo").textContent =
      `${Math.floor(dureeMin/60)}h${dureeMin%60} • ${isInterville?"Inter-villes":"Locale"}`;
  },200);
}
function closeMap(){
  document.getElementById("mapPopup").style.display="none";
}

// =================== EMAIL ===================
function envoyerEmail(){
  window.location.href=
    `mailto:info@leman-courses.ch?subject=Commande&body=${encodeURIComponent(
      `Trajet ${npaDepart.value} → ${npaArrivee.value}\nDistance : ${km.value}\nPrix : ${prix.textContent}`
    )}`;
}

// =================== PDF ===================
function genererPDF(){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF();

  const mapImg=`https://staticmap.openstreetmap.de/staticmap.php?size=600x300&markers=${coordA[1]},${coordA[0]},red|${coordB[1]},${coordB[0]},blue&path=weight:3|color:red|${coordA[1]},${coordA[0]}|${coordB[1]},${coordB[0]}`;

  pdf.text("DEVIS – LÉMAN COURSES",105,15,{align:"center"});
  pdf.text(`Distance : ${km.value}`,10,30);
  pdf.text("Temps indicatif selon conditions de circulation",10,36);
  pdf.text(`Prix : ${prix.textContent}`,10,44);
  pdf.addImage(mapImg,"PNG",10,50,190,90);

  pdf.save("Devis_Leman_Courses.pdf");
}

// =================== EVENTS ===================
[npaDepart,npaArrivee].forEach(e=>e.addEventListener("input",calculKm));
[poids,service].forEach(e=>e.addEventListener("input",()=>calculPrix(parseInt(km.value))));
</script>

</body>
</html>
