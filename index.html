<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Commande transport express</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#0b2a44,#0f3d66);
  padding:20px;
  color:#fff;
}
.wrap{max-width:1000px;margin:auto}
h1{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

.card{
  background:#fff;
  color:#000;
  border-radius:16px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.25)
}

label{font-size:12px;color:#555}
input,select,textarea,button{
  width:100%;
  margin-top:6px;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:14px;
  box-sizing:border-box
}
textarea{min-height:80px}

button{
  background:#0b2a44;
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer
}
button:disabled{opacity:.5}

.price{
  font-size:28px;
  font-weight:bold;
  color:#0b2a44;
  margin-top:10px
}

.note{font-size:12px;color:#666;margin-top:6px}
.status{font-size:12px;margin-top:8px}
.ok{color:green}
.err{color:#b42318}
</style>
</head>

<body>
<div class="wrap">
<h1>LÉMAN COURSES</h1>

<div class="grid">

<!-- COMMANDE -->
<div class="card">
<h2>Commande client</h2>

<label>Nom du client</label>
<input id="clientNom">

<label>Téléphone</label>
<input id="clientTel">

<label>Email (optionnel)</label>
<input id="clientEmail">

<label>Nature du colis</label>
<select id="colisNature">
  <option>Documents</option>
  <option>Colis</option>
  <option>Fragile</option>
  <option>Médical</option>
</select>

<label>Poids (kg)</label>
<input id="colisPoids" type="number" step="0.1">

<hr>

<h3>Prise en charge</h3>

<label>Entreprise (prise en charge)</label>
<input id="pickupEntreprise">

<label>Adresse</label>
<input id="pickupAdresse">

<label>NPA</label>
<input id="pickupNPA">

<label>Ville</label>
<input id="pickupVille">

<hr>

<h3>Livraison</h3>

<label>Entreprise (livraison)</label>
<input id="dropEntreprise">

<label>Adresse</label>
<input id="dropAdresse">

<label>NPA</label>
<input id="dropNPA">

<label>Ville</label>
<input id="dropVille">

<label>Remarques</label>
<textarea id="remarques"></textarea>
</div>

<!-- TARIF -->
<div class="card">
<h2>Tarif & distance</h2>

<label>Urgence</label>
<select id="urgence">
  <option value="0">Standard</option>
  <option value="10">Urgent +10%</option>
  <option value="25">Express +25%</option>
</select>

<label>Horaire</label>
<select id="horaire">
  <option value="1">Jour</option>
  <option value="1.25">Nuit</option>
  <option value="1.3">Dimanche / férié</option>
</select>

<label>Kilomètres (auto)</label>
<input id="km" disabled>

<div class="status" id="kmStatus">En attente des adresses…</div>

<div class="price" id="resultat">CHF 0.–</div>
<div class="note" id="detail"></div>

<button id="sendBtn" disabled>Envoyer la commande (email)</button>
</div>

</div>
</div>

<script>
const DISPATCH_EMAIL = "TONEMAIL@lemancourses.ch";

function round5(v){return Math.round(v/5)*5}

async function geocode(q){
  const u=`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ch&q=${encodeURIComponent(q)}`;
  const r=await fetch(u);const d=await r.json();
  if(!d[0]) return null;
  return {lat:d[0].lat,lon:d[0].lon}
}

async function distance(a,b){
  const u=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;
  const r=await fetch(u);const d=await r.json();
  return d.routes[0].distance/1000;
}

async function compute(){
  const q1=`${pickupAdresse.value}, ${pickupNPA.value} ${pickupVille.value}, Suisse`;
  const q2=`${dropAdresse.value}, ${dropNPA.value} ${dropVille.value}, Suisse`;

  if(!pickupVille.value || !dropVille.value) return;

  kmStatus.textContent="Calcul de la distance…";
  const A=await geocode(q1);
  const B=await geocode(q2);
  if(!A||!B){kmStatus.textContent="Adresse invalide";return}

  const kmVal=Math.round((await distance(A,B))*10)/10;
  km.value=kmVal;

  let base,kmPrice;
  if(kmVal>10){
    base=65;
    kmPrice=kmVal*1.2;
  }else{
    base=35;
    kmPrice=0;
  }

  let prix=(base+kmPrice)*(1+urgence.value/100)*horaire.value;
  prix=round5(prix);

  resultat.textContent=`CHF ${prix}.–`;
  detail.textContent = kmVal>10
    ? `Inter-villes · ${kmVal} km × 1.20 CHF`
    : `Course locale`;

  kmStatus.textContent=`Distance calculée : ${kmVal} km`;
  sendBtn.disabled=false;
}

["pickupAdresse","pickupNPA","pickupVille","dropAdresse","dropNPA","dropVille"].forEach(id=>{
  document.getElementById(id).addEventListener("input",()=>setTimeout(compute,800))
});

sendBtn.onclick=()=>{
  const body=`
COMMANDE LÉMAN COURSES

Client : ${clientNom.value}
Téléphone : ${clientTel.value}
Email : ${clientEmail.value}

PRISE EN CHARGE
Entreprise : ${pickupEntreprise.value}
${pickupAdresse.value}
${pickupNPA.value} ${pickupVille.value}

LIVRAISON
Entreprise : ${dropEntreprise.value}
${dropAdresse.value}
${dropNPA.value} ${dropVille.value}

Colis : ${colisNature.value}
Poids : ${colisPoids.value} kg

Distance : ${km.value} km
Prix estimé : ${resultat.textContent}

Remarques :
${remarques.value}
`;

  location.href=`mailto:${DISPATCH_EMAIL}?subject=Commande Léman Courses&body=${encodeURIComponent(body)}`;
};
</script>
</body>
</html>
