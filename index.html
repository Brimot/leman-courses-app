<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Commande</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0B2A44;
  padding:20px;
  color:#fff;
}
.card{
  max-width:700px;
  margin:auto;
  background:#fff;
  color:#000;
  padding:20px;
  border-radius:14px;
}
h1{color:#0B2A44;margin-top:0}
label{font-weight:bold;font-size:13px}
input,select,button{
  width:100%;
  padding:10px;
  margin:6px 0 12px 0;
}
button{
  background:#0B2A44;
  color:#fff;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
.price{
  font-size:26px;
  text-align:center;
  color:#0B2A44;
  margin:15px 0;
}
.notice{
  text-align:center;
  font-size:13px;
  color:green;
}
</style>
</head>

<body>

<div class="card">
<h1>Commande – Léman Courses</h1>

<label>Nom du client</label>
<input id="nom">

<label>Téléphone</label>
<input id="telephone">

<label>Adresse de prise en charge</label>
<input id="depart">

<label>Adresse de livraison</label>
<input id="arrivee">

<label>Poids du colis</label>
<select id="poids" onchange="calculerPrix()">
  <option value="5">0 – 5 kg</option>
  <option value="10">6 – 10 kg</option>
  <option value="20">11 – 20 kg</option>
  <option value="30">21 – 30 kg</option>
</select>

<div class="price" id="prix">CHF 25.–</div>

<button onclick="envoyerCommande()">Envoyer la commande</button>

<p id="retour" class="notice"></p>
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycby88Wpx7RoxGh_4iaoH66G5JfSri7HngXyBRJyiPSPS_fijMIw_pbqD7pjkviGeGHLi/exec";

function calculerPrix(){
  const p = Number(document.getElementById("poids").value);
  let prix = 25;
  if(p > 5) prix += 10;
  if(p > 10) prix += 15;
  if(p > 20) prix += 20;
  document.getElementById("prix").innerText = "CHF " + prix + ".–";
}

async function envoyerCommande(){
  document.getElementById("retour").innerText = "Envoi de la commande…";

  try{
    await fetch(URL,{
      method:"POST",
      mode:"no-cors",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        nom: nom.value,
        telephone: telephone.value,
        depart: depart.value,
        arrivee: arrivee.value,
        poids: poids.value,
        prix: document.getElementById("prix").innerText
      })
    });

    document.getElementById("retour").innerText =
      "✅ Commande envoyée avec succès (enregistrée)";

  }catch(e){
    document.getElementById("retour").innerText =
      "❌ Erreur d’envoi";
  }
}

calculerPrix();
</script>

</body>
</html>
