<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Léman Courses – Calculateur express</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B2A44">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0b2a44, #0f3d66);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      color: #000;
      width: 100%;
      max-width: 380px;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,.3);
    }

    h1 {
      text-align: center;
      margin: 0;
      color: #0b2a44;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-bottom: 18px;
    }

    select, input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      background: #0b2a44;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .price {
      margin: 18px 0;
      font-size: 26px;
      text-align: center;
      font-weight: bold;
      color: #0b2a44;
    }

    .info {
      text-align: center;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>LÉMAN COURSES</h1>
  <div class="subtitle">Transport express 24h/24 – 7j/7</div>

  <!-- TYPE -->
  <select id="type">
    <option value="35">Course locale</option>
    <option value="65">Course inter-villes</option>
  </select>

  <!-- KM -->
  <div id="kmBlock">
    <input type="number" id="km" placeholder="Distance (km)" min="0">
  </div>

  <!-- URGENCE -->
  <select id="urgence">
    <option value="0">Standard</option>
    <option value="10">Urgente (+10%)</option>
    <option value="25">Express (+25%)</option>
  </select>

  <!-- HORAIRE -->
  <select id="horaire">
    <option value="1">Jour</option>
    <option value="1.25">Nuit (+25%)</option>
    <option value="1.3">Dimanche / férié (+30%)</option>
  </select>

  <button onclick="calculer()">Calculer le tarif</button>

  <div class="price" id="resultat">CHF 35.–</div>

  <button id="pdfBtn" disabled onclick="genererPDF()">Générer le devis PDF</button>

  <div class="info" id="infoText">
    Prix indicatif – confirmation avant la course
  </div>
</div>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const { jsPDF } = window.jspdf;

function arrondir5(val) {
  return Math.round(val / 5) * 5;
}

function calculer() {
  const type = parseFloat(document.getElementById("type").value);
  const kmInput = document.getElementById("km");
  const urgence = parseFloat(document.getElementById("urgence").value);
  const horaire = parseFloat(document.getElementById("horaire").value);
  const kmBlock = document.getElementById("kmBlock");
  const infoText = document.getElementById("infoText");

  let km = 0;
  let supplementKm = 0;

  if (type === 35) {
    kmBlock.style.display = "none";
    infoText.innerText = "Course locale – distance incluse";
  } else {
    kmBlock.style.display = "block";
    km = parseFloat(kmInput.value) || 0;
    infoText.innerText = "Course inter-villes – supplément dès 10 km";
    if (km > 10) supplementKm = (km - 10) * 2.5;
  }

  let prix = (type + supplementKm) * (1 + urgence / 100) * horaire;
  prix = arrondir5(prix);

  document.getElementById("resultat").innerText = "CHF " + prix + ".–";
  document.getElementById("pdfBtn").disabled = false;

  return { type, km, urgence, horaire, prix };
}

function genererPDF() {
  const data = calculer();
  const doc = new jsPDF();

  const date = new Date().toLocaleString("fr-CH");

  doc.setFontSize(16);
  doc.text("DEVIS – LÉMAN COURSES", 20, 20);

  doc.setFontSize(11);
  doc.text("Date : " + date, 20, 30);

  doc.line(20, 35, 190, 35);

  doc.text("Type de course : " + (data.type === 35 ? "Locale" : "Inter-villes"), 20, 45);
  doc.text("Distance : " + data.km + " km", 20, 55);
  doc.text("Urgence : " + data.urgence + " %", 20, 65);
  doc.text("Horaire : x" + data.horaire, 20, 75);

  doc.line(20, 85, 190, 85);

  doc.setFontSize(14);
  doc.text("TOTAL ESTIMÉ : CHF " + data.prix + ".–", 20, 100);

  doc.setFontSize(10);
  doc.text(
    "Prix indicatif. Le devis définitif est confirmé avant la course.\nLéman Courses – Transport express 24h/24 – 7j/7",
    20,
    120
  );

  doc.save("Devis_Leman_Courses.pdf");
}

// recalcul automatique
["type", "km", "urgence", "horaire"].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener("input", calculer);
});

// Service worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}

calculer();
</script>

</body>
</html>
