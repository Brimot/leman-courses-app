<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Léman Courses – Calculateur</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(135deg,#0b2a44,#0f3d6b);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:#000;
}
.card{
  background:#fff;
  width:360px;
  padding:24px;
  border-radius:16px;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
}
h1{
  text-align:center;
  margin:0;
  color:#0b2a44;
}
.subtitle{
  text-align:center;
  font-size:13px;
  color:#555;
  margin-bottom:20px;
}
label{
  font-size:13px;
  margin-top:12px;
  display:block;
}
select,input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:14px;
}
.price{
  text-align:center;
  font-size:26px;
  font-weight:bold;
  margin:18px 0;
  color:#0b2a44;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#0b2a44;
  color:#fff;
  font-size:15px;
  cursor:pointer;
  margin-top:10px;
}
button:hover{background:#0f3d6b}
.info{
  font-size:12px;
  color:#444;
  margin-top:10px;
  text-align:center;
}
.footer{
  text-align:center;
  font-size:11px;
  color:#666;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="card">
  <h1>LÉMAN COURSES</h1>
  <div class="subtitle">Transport express 24h/24 – 7j/7</div>

  <label>Type de service</label>
  <select id="service">
    <option value="normal">Normal</option>
    <option value="urgent">Urgent</option>
    <option value="express">Express</option>
  </select>

  <label>Distance (km)</label>
  <input id="km" type="number" min="1" placeholder="Ex : 25">

  <label>Poids du colis (kg)</label>
  <input id="poids" type="number" min="1" placeholder="Max 30 kg">

  <label>Inter-villes ?</label>
  <select id="interville">
    <option value="no">Non</option>
    <option value="yes">Oui</option>
  </select>

  <label>Horaire</label>
  <select id="horaire">
    <option value="jour">Jour</option>
    <option value="nuit">Nuit / Dimanche</option>
  </select>

  <div class="price" id="resultat">CHF –.–</div>
  <div class="info" id="detail"></div>

  <button onclick="envoyerCommande()">Envoyer la commande</button>

  <div class="info" id="serviceInfo"></div>

  <div class="footer">
    Prix indicatif – confirmation avant la course
  </div>
</div>

<script>
const resultat = document.getElementById("resultat");
const detail = document.getElementById("detail");
const serviceInfo = document.getElementById("serviceInfo");

function prixGrille(km, service){
  const grille = [
    {max:10,n:6.5,u:43,e:30},
    {max:30,n:10,u:73,e:48},
    {max:80,n:13.5,u:103,e:66},
    {max:150,n:17,u:133,e:84},
    {max:250,n:20.5,u:163,e:102},
    {max:300,n:24,u:193,e:120},
    {max:400,n:31,u:253,e:156},
    {max:500,n:38,u:313,e:192},
    {max:700,n:52,u:433,e:264},
    {max:1000,n:73,u:613,e:372},
    {max:1500,n:108,u:913,e:552}
  ];
  const row = grille.find(g=>km<=g.max);
  if(!row) return null;
  return service==="normal"?row.n:service==="urgent"?row.u:row.e;
}

function coefPoids(p){
  if(p<=5) return 1;
  if(p<=10) return 1.1;
  if(p<=20) return 1.25;
  if(p<=30) return 1.4;
  return null;
}

function updatePrice(){
  const km=Number(kmInput.value);
  const poids=Number(poidsInput.value);
  const service=serviceSelect.value;
  const inter=intervilleSelect.value;
  const horaire=horaireSelect.value;

  if(!km||!poids) return;

  if(poids>30){
    resultat.textContent="Devis requis";
    detail.textContent="Colis > 30 kg";
    return;
  }

  let prix=prixGrille(km,service);
  if(prix===null){
    resultat.textContent="Devis requis";
    return;
  }

  if(inter==="yes") prix+=km*1.2;
  if(horaire==="nuit") prix*=1.25;

  prix*=coefPoids(poids);
  prix=Math.ceil(prix/5)*5;

  resultat.textContent=`CHF ${prix}.–`;
  detail.textContent=`${km} km · ${poids} kg · ${service.toUpperCase()}`;
}

function updateServiceInfo(){
  const s=serviceSelect.value;
  serviceInfo.textContent=
    s==="normal"?"Course standard – prise en charge rapide.":
    s==="urgent"?"Course urgente – priorité immédiate.":
    "Course express – enlèvement immédiat, livraison directe sans arrêt.";
}

function envoyerCommande(){
  alert("Commande envoyée – nous vous contactons rapidement.");
}

con
